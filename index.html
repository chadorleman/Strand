<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strand</title>
<!--
  STRAND  ·  a personal habit tracker played as a growing DNA strand
  One standalone file. No server, no build step. Open it in Chrome or Edge.

  WHERE THE DATA LIVES
    Data > "Sync to GitHub" saves strand-data.json to a private repo through the
    GitHub API, with a fine-grained token kept in this browser only. Every save is
    a commit. This is the way to use Strand on more than one device.
    Data > "Link my Strand folder" picks a folder. Strand then reads and writes
    strand-data.json in that folder after every change. Until a folder is linked,
    data is kept in this browser's storage. Data > Export / Import is the backup.

  ENTRY IMPORT FORMAT  (Data > Import entries)
    { "strandImport": 1,
      "entries": [
        { "importId": "2026-11-15-a", "date": "2026-11-15", "habit": "water" },
        { "importId": "2026-11-14-c", "date": "2026-11-14", "habit": "alcohol", "amount": 2, "note": "optional" }
      ] }
    importId  unique text per entry; an ID already merged is skipped
    date      YYYY-MM-DD, the day it happened
    habit     sleep, water, fasting, pushups, gym, mindfulness, vitamins, alcohol,
              dailyText, bible, study, midweek, watchtower
    amount    alcohol only: number of drinks

  MEDIA IMPORT FORMAT  (Vault)
    Put files in a folder named "media" beside this page (inside the linked folder).
    File name = milestone ID:   media/stage-protocell.mp4    media/compound-glycine.png
    Films: .mp4 (H.264) or .webm     Cards: .png .jpg .webp
    A slot's "Copy media request" gives the JSON Claude needs to render the art.

  EVERY TUNABLE NUMBER is in one block: search this file for "SETTINGS BLOCK",
  or use the Settings panel in the tool.

  GENES: every week that closes stable earns one permanent pick from three offered
  traits. Picks are stored under "traits" in the data file; the catalogue is in the
  settings block.

  WALKTHROUGH: the Walkthrough button plays a spoken guide using the browser's own
  voices (Edge's "Natural" voices sound best). Its script reads the live settings.

  FUTURE MODULES: the data file has a "modules" block, and every log entry and
  ledger row carries a "module" name. "nutrition" is reserved and not built.
-->
<style>
:root{
  --abyss:#04121a; --deep:#071f2b; --panel:rgba(10,36,48,.66); --panel2:rgba(16,52,66,.55);
  --line:rgba(150,215,225,.15); --line2:rgba(150,215,225,.28);
  --ink:#e6f3f1; --dim:#8fb2b7; --faint:#5e8188;
  --aqua:#58efc9; --amber:#ffbe55; --lesion:#ff4d78; --gold:#ffe9a6; --frost:#a8dcff; --bond:#c9b8ff;
  --display:Bahnschrift,"DIN Alternate","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--abyss);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1100px 620px at 14% -8%,rgba(22,96,104,.55),transparent 62%),
  radial-gradient(900px 700px at 96% 108%,rgba(58,36,120,.42),transparent 60%),
  radial-gradient(700px 420px at 70% 18%,rgba(12,70,92,.35),transparent 65%),
  linear-gradient(180deg,#04121a,#03101a 60%,#050d1c)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--aqua);outline-offset:3px;border-radius:8px}
input,textarea,select{font:inherit;color:var(--ink);background:rgba(3,18,26,.7);border:1px solid var(--line2);border-radius:8px;padding:6px 9px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

.app{height:100vh;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr)}

/* sample notice */
.samplebar{display:flex;gap:14px;align-items:center;justify-content:center;padding:6px 16px;background:rgba(255,190,85,.12);border-bottom:1px solid rgba(255,190,85,.3);color:#ffdca0;font-size:13.5px}
.samplebar button{border:1px solid rgba(255,190,85,.5);border-radius:99px;padding:2px 12px;color:#ffe3b3}
.samplebar button:hover{background:rgba(255,190,85,.16)}
.samplebar[hidden]{display:none}

/* ---------- field: HUD floats over the strand ---------- */
.field{position:relative;height:clamp(290px,41vh,460px);border-bottom:1px solid var(--line);overflow:hidden;user-select:none}
#helix{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#helix.drag{cursor:grabbing}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 22px 6px;position:relative;z-index:3;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font:600 21px/1 var(--display);letter-spacing:.02em}
.brand svg{width:26px;height:26px}
.stagebox{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center;text-align:left;padding:4px 6px;border-radius:12px}
.stagebox:hover{background:rgba(255,255,255,.04)}
.emblem{grid-row:1/3;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(88,239,201,.28),rgba(88,239,201,.04) 70%);border:1px solid var(--line2)}
.emblem svg{width:30px;height:30px}
.stagename{display:flex;align-items:baseline;gap:9px}
.stagename strong{font:600 23px/1 var(--display)}
.stagename span{color:var(--dim);font-size:13px}
.stagebar{position:relative;height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;width:clamp(104px,11.5vw,230px)}
.stagebar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--aqua),#b6f7a0 60%,var(--gold));transition:width .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(88,239,201,.6)}
.stagebar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(4,18,26,.55) calc(10% - 1px) 10%)}
.stagerow{display:flex;align-items:center;gap:12px}
.tonext{color:var(--dim);font-size:12.5px;white-space:nowrap}
.tonext b{color:var(--ink);font-family:var(--display);font-weight:600}
.spacer{flex:1}
.tally{text-align:right}
.tally .big{font:600 34px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tally .big small{font:400 13px var(--body);color:var(--dim);margin-left:6px}
.splitrow{display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:12.5px;color:var(--dim);margin-top:5px;white-space:nowrap}
.splitrow b{color:var(--ink);font-family:var(--display);font-weight:600}
.split{display:flex;height:6px;width:110px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.07)}
.split i{background:var(--bond)}
.split u{background:repeating-linear-gradient(115deg,rgba(230,243,241,.55) 0 3px,rgba(230,243,241,.16) 3px 6px)}
.splitrow .kb::before,.splitrow .kl::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--bond)}
.splitrow .kl::before{background:repeating-linear-gradient(115deg,rgba(230,243,241,.7) 0 2px,rgba(230,243,241,.2) 2px 4px)}
.vitals{display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-size:13px;color:var(--dim);white-space:nowrap}
.vitals b{color:var(--ink);font:600 16px var(--display)}
.shields{display:flex;align-items:center;gap:4px}
.shields svg{width:19px;height:21px}
.shields .on path{fill:rgba(168,220,255,.25);stroke:var(--frost)}
.shields .off path{fill:none;stroke:rgba(168,220,255,.25)}
.nav{display:flex;gap:2px}
.nav button{white-space:nowrap;padding:7px 8px;border-radius:99px;color:var(--dim);font:500 14px var(--display);letter-spacing:.02em}
.nav button:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.nav button[aria-pressed="true"]{color:var(--aqua)}
.nav button[aria-pressed="false"]{text-decoration:line-through;opacity:.7}
.nav .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:5px;vertical-align:2px;box-shadow:0 0 8px var(--gold)}

.fieldctl{position:absolute;right:20px;bottom:14px;display:flex;gap:6px;z-index:3}
.fieldctl button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:rgba(4,18,26,.6);color:var(--dim);font:500 16px var(--display)}
.fieldctl button.txt{width:auto;padding:0 13px;font-size:13px}
.fieldctl button:hover{color:var(--ink);border-color:var(--aqua)}
#mini{position:absolute;left:22px;bottom:16px;width:min(340px,30vw);height:26px;z-index:3;cursor:pointer;opacity:.9}
.key{position:absolute;left:calc(22px + min(340px,30vw) + 18px);bottom:19px;display:flex;gap:14px;font-size:12px;color:var(--faint);z-index:3;white-space:nowrap}
.key i{display:inline-block;vertical-align:-1px;margin-right:5px}
.key .k1{width:16px;height:3px;background:var(--bond);border-radius:2px;vertical-align:3px}
.key .k2{width:16px;height:0;border-top:1.5px dashed rgba(230,243,241,.45);vertical-align:3px}
.key .k3{width:9px;height:9px;border:1.5px solid var(--frost);transform:rotate(45deg) scale(.85)}
.key .k4{width:9px;height:9px;background:var(--lesion);border-radius:2px}
.key .k5{width:9px;height:9px;background:var(--gold);transform:rotate(45deg) scale(.8)}
#tip{position:absolute;z-index:6;pointer-events:none;max-width:270px;padding:9px 12px;border-radius:10px;background:rgba(3,16,24,.94);border:1px solid var(--line2);font-size:13px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{font-family:var(--display);font-weight:600;font-size:14.5px}
#tip .t2{color:var(--dim)}

/* ---------- deck ---------- */
.deck{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;min-height:0}
.left{padding:14px 22px 22px;overflow:auto;min-height:0}
.side{border-left:1px solid var(--line);padding:14px 18px 22px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(6,28,38,.5),rgba(6,22,34,.2))}
.daybar{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.daybar h2{font-size:22px;min-width:218px}
.daybar .step{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);color:var(--dim);font-size:16px;line-height:1}
.daybar .step:hover:not(:disabled){color:var(--ink);border-color:var(--aqua)}
.daybar .step:disabled{opacity:.3;cursor:default}
.daybar .earn{font:600 16px var(--display);color:var(--aqua)}
.daybar .note{color:var(--dim);font-size:13px}
.daybar .back{border:1px solid var(--line2);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--dim)}
.daybar .back:hover{color:var(--ink);border-color:var(--aqua)}

.cluster{margin-top:8px}
.cluster h3{font-size:14px;font-weight:500;color:var(--dim);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cluster h3::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--cat)}
.cluster h3 span{color:var(--faint);font-family:var(--body);font-size:12.5px}
.cluster[data-cat="health"]{--cat:var(--aqua)} .cluster[data-cat="spiritual"]{--cat:var(--amber)}
.atoms{display:flex;flex-wrap:wrap;gap:6px 4px}
.atom{--c:hsl(var(--hue) 88% 68%);--cd:hsl(var(--hue) 70% 30%);position:relative;width:108px;padding:8px 4px 7px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .15s,transform .12s}
.atom:hover{background:rgba(255,255,255,.05)}
.atom:active{transform:scale(.96)}
.nuc{position:relative;width:72px;height:72px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 34% 28%,hsl(var(--hue) 60% 26% / .9),hsl(var(--hue) 60% 11% / .9) 72%);transition:box-shadow .3s,background .3s}
.nuc b{font:600 25px/1 var(--display);color:var(--c);letter-spacing:.01em;position:relative}
.nuc svg{position:absolute;inset:-5px;width:82px;height:82px;transform:rotate(-90deg)}
.nuc svg .tr{fill:none;stroke:hsl(var(--hue) 50% 60% / .28);stroke-width:2}
.nuc svg .fi{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.atom .nm{font:500 13.5px/1.15 var(--display);text-align:center;letter-spacing:.01em;min-height:15px}
.atom .sub{display:flex;gap:7px;font-size:12px;color:var(--dim);font-family:var(--display);font-variant-numeric:tabular-nums}
.atom .sub i{font-style:normal;color:var(--c)}
.atom.done .nuc{background:radial-gradient(circle at 34% 28%,#fff,var(--c) 34%,hsl(var(--hue) 80% 42%) 82%);box-shadow:0 0 0 1px hsl(var(--hue) 90% 80% / .7),0 0 26px hsl(var(--hue) 90% 60% / .55)}
.atom.done .nuc b{color:#04202a}
.atom.done .nm{color:var(--c)}
.atom.pop .nuc{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.8)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.atom.locked{cursor:default;opacity:.62}
.atom.locked:hover{background:none}
.atom.arm .nm{color:var(--gold)}
.atom:disabled{cursor:default;opacity:.5}
.atom.neg{--c:var(--lesion)}
.atom.neg .nuc{border-radius:20px;transform:rotate(45deg) scale(.82);background:rgba(255,77,120,.1);border:1.5px dashed rgba(255,77,120,.65)}
.atom.neg .nuc b{transform:rotate(-45deg);font-size:26px}
.atom.neg.open .nuc{background:rgba(255,77,120,.22);border-style:solid}
.negpop{margin:8px 0 0;padding:14px 16px;border-radius:var(--r);border:1px solid rgba(255,77,120,.4);background:rgba(60,12,30,.45);display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:720px}
.negpop p{margin:0;font-size:13.5px;color:#f3c9d4;flex:1;min-width:220px}
.negpop p b{color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,77,120,.6);font-size:18px}
.stepper output{font:600 24px var(--display);min-width:92px;text-align:center}
.stepper output small{font:400 13px var(--body);color:var(--dim);margin-left:5px}
.btn{border:1px solid var(--line2);border-radius:99px;padding:7px 16px;font:500 14px var(--display);letter-spacing:.02em;background:rgba(255,255,255,.04)}
.btn:hover{border-color:var(--aqua);background:rgba(88,239,201,.08)}
.btn.go{background:var(--aqua);color:#03202a;border-color:var(--aqua);font-weight:600}
.btn.go:hover{background:#8af7dd}
.btn.hot{background:var(--lesion);color:#2a0612;border-color:var(--lesion);font-weight:600}
.btn.gold{background:var(--gold);color:#2b2204;border-color:var(--gold);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:4px 12px;font-size:13px}

/* ---------- side panels ---------- */
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:13px 15px}
.card h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 span{font:400 12.5px var(--body);color:var(--dim)}
.mol{display:flex;gap:12px;align-items:center}
.mol svg{width:150px;height:150px;flex:none}
.mol .e{stroke:rgba(230,243,241,.14);stroke-width:1.5;fill:none}
.mol .e.on{stroke:rgba(230,243,241,.75);stroke-width:2}
.mol .e.dbl{stroke:var(--gold);stroke-width:5}
.mol .e.dbl2{stroke:#0b2a36;stroke-width:1.6}
.mol circle{fill:rgba(6,26,36,.9);stroke-width:1.5;transition:fill .3s}
.mol text{font:600 10px var(--display);text-anchor:middle;dominant-baseline:central}
.mol .ctr{font:600 21px var(--display);fill:var(--ink)}
.mol .ctr2{font:400 10.5px var(--body);fill:var(--dim)}
.mol.stable svg{filter:drop-shadow(0 0 10px rgba(255,233,166,.55))}
.rts{flex:1;display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--dim)}
.rts div b{display:block;color:var(--ink);font:500 14px var(--display)}
.rts .ok b{color:var(--gold)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:2px 0 9px}
.week div{text-align:center;font-size:11.5px;color:var(--faint)}
.week i{display:block;height:26px;border-radius:7px;border:1px solid var(--line2);margin-bottom:3px;position:relative}
.week .act i{background:rgba(88,239,201,.16);border-color:rgba(88,239,201,.4)}
.week .sol i{background:linear-gradient(180deg,rgba(88,239,201,.75),rgba(88,239,201,.4));border-color:var(--aqua)}
.week .stb i{background:linear-gradient(180deg,var(--gold),rgba(255,190,85,.6));border-color:var(--gold)}
.week .shd i{border-color:var(--frost);background:rgba(168,220,255,.14)}
.week .gap i{border-style:dashed;opacity:.5}
.week .now{color:var(--ink)} .week .now i{box-shadow:0 0 0 2px rgba(230,243,241,.35)}
.card p{margin:0;font-size:13px;color:var(--dim)}
.card p b{color:var(--ink);font-family:var(--display);font-weight:600}
.repair{border-color:rgba(255,77,120,.5);background:rgba(54,12,30,.5)}
.repair.fixed{border-color:rgba(255,233,166,.45);background:rgba(50,42,12,.35)}
.repair ol{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:9px;counter-reset:s}
.repair li{counter-increment:s;display:grid;grid-template-columns:22px 1fr;gap:9px;font-size:13px;color:var(--dim)}
.repair li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:600 12px var(--display);color:var(--ink)}
.repair li.ok::before{content:"✓";background:var(--gold);color:#2b2204;border-color:var(--gold)}
.repair li b{color:var(--ink);font:500 14px var(--display);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line2);border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--ink)}
.chips button:hover{border-color:var(--gold)}
.chips button[aria-pressed="true"]{background:rgba(255,233,166,.18);border-color:var(--gold);color:var(--gold)}

.genechip{position:absolute;right:20px;top:10px;z-index:3;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:5px 13px;font:600 13.5px var(--display);letter-spacing:.02em;white-space:nowrap;background:rgba(255,233,166,.1);box-shadow:0 0 18px rgba(255,233,166,.25);animation:chip 2.4s ease-in-out infinite}
.genechip:hover{background:rgba(255,233,166,.2)}
.genechip[hidden]{display:none}
@keyframes chip{50%{box-shadow:0 0 26px rgba(255,233,166,.55)}}
.gene{border-color:rgba(255,233,166,.55);background:linear-gradient(180deg,rgba(60,50,14,.42),rgba(10,36,48,.66))}
.gene.pulse{animation:genepulse .9s}
@keyframes genepulse{30%{box-shadow:0 0 0 4px rgba(255,233,166,.5)}}
.gopts{display:flex;flex-direction:column;gap:7px;margin:10px 0 11px}
.gopt{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:center;text-align:left;padding:7px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(3,18,26,.45);transition:border-color .15s,background .15s}
.gopt:hover{border-color:var(--gold)}
.gopt b{font:600 15px var(--display)}
.gopt span{grid-column:1;font-size:12.5px;color:var(--dim)}
.gopt .pips{grid-row:1/3;grid-column:2}
.gopt[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,233,166,.14)}
.gopt[aria-pressed="true"] b{color:var(--gold)}
.pips{display:inline-flex;gap:4px;font-style:normal}
.pips u{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,233,166,.5);text-decoration:none}
.pips u.on{background:var(--gold);border-color:var(--gold)}
.pips u.nx{border-style:dashed;border-color:var(--gold)}
.genome{display:flex;flex-direction:column;gap:9px}
.genome div{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:center}
.genome b{font:500 14px var(--display);color:var(--gold)}
.genome span{grid-column:1/3;font-size:12.5px;color:var(--dim)}

#spot{position:fixed;left:0;top:0;z-index:26;pointer-events:none;border-radius:16px;border:2px solid var(--gold);box-shadow:0 0 0 9999px rgba(2,10,16,.5),0 0 30px rgba(255,233,166,.45);opacity:0;transition:opacity .3s,transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1)}
#spot.on{opacity:1}
#guide{position:fixed;left:50%;bottom:20px;z-index:27;width:min(620px,94vw);transform:translate(-50%,140%);transition:transform .38s cubic-bezier(.2,.8,.2,1),bottom .45s cubic-bezier(.2,.8,.2,1);background:rgba(5,24,34,.97);border:1px solid rgba(255,233,166,.45);border-radius:18px;padding:13px 16px 12px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#guide.on{transform:translate(-50%,0)}
#guide.up{bottom:calc(100vh - 20px - var(--gh,210px))}

.gtop{display:flex;align-items:center;gap:10px}
#gChap{flex:1;font:600 14px var(--display);color:var(--gold);letter-spacing:.02em}
.gtxt{font:500 13px var(--display);color:var(--dim);padding:3px 10px;border:1px solid var(--line2);border-radius:99px}
.gtxt:hover{color:var(--ink);border-color:var(--gold)}
.gx{width:28px;height:28px;border-radius:50%;color:var(--dim);font-size:14px}
.gx:hover{color:var(--ink);background:rgba(255,255,255,.07)}
#gCap{margin:8px 0 10px;font:400 17px/1.45 var(--body);color:var(--ink);min-height:50px}
#gBar{display:flex;gap:4px;margin-bottom:11px}
#gBar button{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
#gBar button:hover{background:rgba(255,255,255,.2)}
#gBar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);transition:width .4s}
.gctl{display:flex;align-items:center;gap:8px}
.gctl button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line2)}
.gctl button:hover{border-color:var(--gold)}
.gctl svg{width:15px;height:15px;fill:currentColor}
.gctl .gplay{width:44px;height:44px;background:var(--gold);color:#2b2204;border-color:var(--gold)}
.gctl .gplay svg{width:18px;height:18px}
.gctl select{margin-left:auto;max-width:230px;font-size:13px;padding:5px 8px}
.gctl #gRate{margin-left:0;width:78px}
#gList{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 0 2px}
#gList[hidden]{display:none}
#gList button{text-align:left;padding:6px 9px;border-radius:9px;font:500 13.5px var(--display);color:var(--dim);display:flex;gap:9px;align-items:center}
#gList button span{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11.5px;flex:none}
#gList button:hover{background:rgba(255,255,255,.05);color:var(--ink)}
#gList button[aria-current="true"]{color:var(--gold)}
#gList button[aria-current="true"] span{background:var(--gold);color:#2b2204;border-color:var(--gold)}
@media (max-width:640px){.gctl select{max-width:120px}#gList{grid-template-columns:1fr}}

.steps{color:var(--dim);font-size:13.5px;padding-left:20px;margin:6px 0 12px;max-width:68ch}
.steps li{margin-bottom:6px}
#drawer a{color:var(--aqua)}
#drawer a.btn{color:var(--ink);text-decoration:none;display:inline-block}
.ghf input{text-align:left!important;font-family:var(--body)!important}
.grid2.ghf{grid-template-columns:170px minmax(0,1fr);max-width:560px}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(2,10,16,.6);backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,96vw);z-index:21;background:linear-gradient(180deg,#082431,#051a26);border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
#drawer.on{transform:none}
#drawer header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 12px}
#drawer header h2{font-size:25px}
#drawer .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);font-size:17px;color:var(--dim)}
#drawer .x:hover{color:var(--ink);border-color:var(--aqua)}
#drawer .body{padding:4px 24px 30px;overflow:auto;flex:1}
#drawer h3{font-size:16px;margin:22px 0 4px}
#drawer h3:first-child{margin-top:4px}
#drawer p{color:var(--dim);font-size:13.5px;margin:4px 0 10px;max-width:68ch}
#drawer p b,#drawer li b{color:var(--ink)}
#drawer code,#drawer pre{font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px}
#drawer pre{background:rgba(2,12,18,.75);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;color:#cfe9e6;line-height:1.5;user-select:text}
#drawer ul{color:var(--dim);font-size:13.5px;padding-left:18px;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.status{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:13.5px}
.status i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.status.ok i{background:var(--aqua);box-shadow:0 0 10px var(--aqua)}
.status.bad i{background:var(--lesion);box-shadow:0 0 10px var(--lesion)}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
.slot{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.slot .art{aspect-ratio:16/9;background:radial-gradient(circle at 50% 40%,rgba(88,239,201,.1),rgba(2,12,18,.6) 70%);display:grid;place-items:center;position:relative;color:var(--faint);font-size:12.5px;text-align:center;padding:10px}
.slot.card-kind .art{aspect-ratio:5/7}
.slot .art video,.slot .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .art .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,12,18,.25)}
.slot .art .play span{width:54px;height:54px;border-radius:50%;background:rgba(230,243,241,.92);color:#04202a;display:grid;place-items:center;font-size:20px;padding-left:4px}
.slot .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.slot .meta b{font:600 15px var(--display)}
.slot .meta span{font-size:12.5px;color:var(--dim)}
.slot.locked{opacity:.55}
.slot.awaiting{border-color:rgba(255,233,166,.5)}
.slot.awaiting .art{color:var(--gold)}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:500 12.5px var(--display);color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#07212d}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums}
td.pos{color:var(--aqua)} td.negv{color:var(--lesion)}
.tag{display:inline-block;padding:0 8px;border-radius:99px;font-size:11.5px;border:1px solid var(--line2);color:var(--dim)}
.tag.b{border-color:var(--bond);color:var(--bond)} .tag.c{border-color:var(--lesion);color:var(--lesion)}
.grid2{display:grid;grid-template-columns:1fr 110px;gap:6px 12px;align-items:center;max-width:520px}
.grid2 label{font-size:13.5px;color:var(--ink)}
.grid2 label small{display:block;color:var(--faint);font-size:12px}
.grid2 input{width:100%;text-align:right;font-family:var(--display)}
textarea{width:100%;min-height:150px;font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px;line-height:1.45;resize:vertical}
.hw td input[type=number]{width:74px;text-align:right;font-family:var(--display)}
.hw .sym{font:600 14px var(--display);width:30px}

/* ---------- overlays ---------- */
#cine{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(9,52,62,.985),rgba(2,10,16,.995) 72%)}
#cine.on{display:grid;animation:fadein .35s}
#cine.lite{pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(9,52,62,.93),rgba(2,10,16,.5) 75%);animation:litefade 2.7s forwards}
@keyframes litefade{0%{opacity:0}10%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#cine canvas{position:absolute;inset:0;width:100%;height:100%}
#cine .inner{position:relative;text-align:center;max-width:760px;padding:20px}
#cine .ph{color:var(--gold);font:500 17px var(--display);letter-spacing:.04em;animation:rise .7s .15s both}
#cine h1{font-size:clamp(54px,9vw,120px);line-height:1;font-stretch:condensed;margin:6px 0 14px;animation:rise .8s .3s both;background:linear-gradient(180deg,#fff,var(--aqua));-webkit-background-clip:text;background-clip:text;color:transparent}
#cine p{color:var(--dim);font-size:15.5px;margin:0 auto 20px;max-width:52ch;animation:rise .8s .5s both}
#cine .row{justify-content:center;animation:rise .8s .7s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#cine video,#cine img.full{position:relative;max-width:min(92vw,1280px);max-height:80vh;border-radius:14px;box-shadow:0 30px 100px rgba(0,0,0,.7);background:#000}
#cine .close{position:absolute;top:18px;right:22px;z-index:2}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.fly{position:fixed;z-index:31;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%);box-shadow:0 0 22px var(--c),0 0 6px #fff}
.float{position:fixed;z-index:32;pointer-events:none;font:600 19px var(--display);white-space:nowrap;transform:translate(-50%,-50%);animation:floatup 1.25s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.float.big{font-size:25px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}14%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-250%) scale(1)}}
#flash{position:fixed;inset:0;z-index:29;pointer-events:none;opacity:0}
#flash.gold{animation:fl .7s;background:radial-gradient(circle at 50% 40%,rgba(255,233,166,.35),transparent 65%)}
#flash.red{animation:fl .9s;box-shadow:inset 0 0 160px rgba(255,77,120,.55)}
@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#toasts{position:fixed;left:50%;top:128px;transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,92vw);pointer-events:none}
.toast{pointer-events:auto;padding:11px 15px;border-radius:12px;background:rgba(3,18,26,.96);border:1px solid var(--line2);font-size:13.5px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:toastin .3s cubic-bezier(.2,.8,.2,1)}
.toast b{font-family:var(--display);font-weight:600}
.toast.gold{border-color:var(--gold)} .toast.frost{border-color:var(--frost)} .toast.bad{border-color:var(--lesion)}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes toastin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(2,10,16,.7)}
#modal.on{display:grid}
#modal .box{width:min(480px,92vw);background:#082431;border:1px solid var(--line2);border-radius:16px;padding:22px 24px}
#modal h3{font-size:19px;margin-bottom:8px}
#modal p{color:var(--dim);font-size:14px;margin:0 0 16px}

@media (min-width:1700px) and (min-height:950px){
  .atom{width:126px}.nuc{width:86px;height:86px}.nuc svg{width:96px;height:96px}.nuc b{font-size:30px}.atom .nm{font-size:15px}.atom .sub{font-size:13px}
  .deck{grid-template-columns:minmax(0,1fr) 380px}.mol svg{width:170px;height:170px}
}
@media (max-width:1100px){
  .hud{flex-wrap:wrap;gap:10px 18px}.vitals{flex-direction:row;gap:14px;min-width:0}.key{display:none}
  .deck{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}
  body{overflow:hidden auto}.app{height:auto;min-height:100vh}.left,.side{overflow:visible}
}
@media (max-width:640px){
  .field{height:420px}.stagebox{min-width:0;width:100%}.tally{text-align:left}.splitrow{justify-content:flex-start}
  .atom{width:84px}.nav button{padding:6px 8px}#mini{width:46vw}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<body>
<div class="app" id="app">
  <div class="samplebar" id="samplebar" hidden>
    <span><b>Sample data.</b> These entries are fake, made up so you can try everything before your first real day.</span>
    <button id="gStart">Play the walkthrough</button>
    <button id="clearSample">Clear the sample and start my strand</button>
  </div>

  <header class="hud">
      <div class="brand">
        <svg viewBox="0 0 26 26" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 5c8 0 12 16 20 16" stroke="#58efc9"/><path d="M3 21c8 0 12-16 20-16" stroke="#ffbe55"/><path d="M8.5 9.5v7M13 11v4M17.5 9.5v7" stroke="#e6f3f1" stroke-opacity=".55" stroke-width="1.4"/></svg>
        Strand
      </div>
      <button class="stagebox" id="stagebox" title="Open the vault">
        <div class="emblem" id="emblem"></div>
        <div class="stagename"><strong id="stageName">Nucleotide</strong><span id="stagePhase">Strand phase</span></div>
        <div class="stagerow"><div class="stagebar"><i id="stageFill" style="width:0%"></i></div><span class="tonext" id="toNext"></span></div>
        
      </button>
      <div class="spacer"></div>
      <div class="vitals">
        <div><b id="chainN">0</b> day chain</div>
        <div class="shields" id="shields" title="Shields. One is spent automatically on a missed day so the chain survives."></div>
      </div>
      <div class="tally">
        <div class="big"><span id="pts" class="num">0</span><small>points</small></div>
        <div class="splitrow"><div class="split" id="split"><i></i><u></u></div><span class="kb"><b id="bondedN">0</b> bonded</span><span class="kl"><b id="looseN">0</b> loose</span></div>
      </div>
      <nav class="nav" aria-label="Panels">
        <button id="navGuide" title="A spoken walkthrough of the rules">Walkthrough</button>
        <button data-open="vault" id="navVault">Vault</button>
        <button data-open="ledger">Ledger</button>
        <button data-open="settings">Settings</button>
        <button data-open="data" id="navData">Data</button>
        <button id="soundBtn" aria-pressed="true" title="Sound on or off">Sound</button>
      </nav>
    </header>

  <section class="field" id="field">
    <canvas id="helix" aria-label="Your strand. Drag to move through time, scroll to zoom, click a day to open it."></canvas>
    <button class="genechip" id="geneChip" hidden title="A stable week earned a gene. Choose it in the side panel."></button>
    <canvas id="mini" title="The whole strand. Click to jump."></canvas>
    <div class="key">
      <span><i class="k1"></i>bonded for good</span><span><i class="k2"></i>still loose</span><span><i class="k3"></i>shield spent</span><span><i class="k4"></i>damaged</span><span><i class="k5"></i>repaired</span>
    </div>
    <div class="fieldctl">
      <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="goToday" class="txt">Today</button>
    </div>
    <div id="tip" role="status"></div>
  </section>

  <main class="deck">
    <div class="left" id="left"></div>
    <aside class="side" id="side"></aside>
  </main>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <header><h2 id="drawerTitle"></h2><button class="x" id="drawerClose" aria-label="Close">✕</button></header>
  <div class="body" id="drawerBody"></div>
</aside>
<div id="cine"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="spot" aria-hidden="true"></div>
<section id="guide" aria-label="Walkthrough">
  <div class="gtop"><span id="gChap"></span><button data-g="list" class="gtxt">Chapters</button><button data-g="close" class="gx" aria-label="Close the walkthrough">✕</button></div>
  <div id="gList" hidden></div>
  <p id="gCap" aria-live="polite"></p>
  <div id="gBar"></div>
  <div class="gctl">
    <button data-g="prev" aria-label="Previous chapter"><svg viewBox="0 0 20 20"><path d="M14 4L6 10l8 6z"/><rect x="4" y="4" width="2" height="12"/></svg></button>
    <button data-g="play" id="gPlay" class="gplay"></button>
    <button data-g="next" aria-label="Next chapter"><svg viewBox="0 0 20 20"><path d="M6 4l8 6-8 6z"/><rect x="14" y="4" width="2" height="12"/></svg></button>
    <select id="gVoice" aria-label="Voice"></select>
    <select id="gRate" aria-label="Speed"><option value="0.85">0.85×</option><option value="1">1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
  </div>
</section>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="filePick" hidden>

<script>
/* ==========================================================================
   STRAND ENGINE  —  rules only, no screen code.
   Shared by every module (habits now; nutrition later) so there is one
   points ledger and one set of rules. Nothing in here touches the page.
   ========================================================================== */
(function (root) {
'use strict';

var SCHEMA = 1;

/* ==========================================================================
   SETTINGS BLOCK  —  every tunable number lives here.
   Edit them in the tool under Settings, or directly in the data file under
   "settings". These are starting values, not laws.
   ========================================================================== */
var DEFAULT_SETTINGS = {
  weekStartsOn: 1,                    // 1 = Monday (so Sunday's Watchtower prep closes the week)
  backfillDays: 7,                    // how many past days the deck lets you check in for

  points: {
    integrity: 3,                     // fixed reward for logging a negative honestly
    bond: 5,                          // a routine completed in one day
    stableMolecule: 15                // every daily habit done, in every category
  },

  activeDay: { minCheckins: 1 },      // fewer positives than this = a missed day (a gap)
  stableDay: { fractionPerCategory: 1 }, // share of each category's daily habits needed for a stable molecule

  stableWeek: {
    solidDayMinCheckins: 4,           // a "solid day" has at least this many positives
    minSolidDays: 5                   // a week with this many solid days closes stable: gains bond, a shield is earned
  },

  shields: { starting: 1, max: 3, perStableWeek: 1 },

  // Reward thinning: as a habit's streak matures, base pay drops and bonus odds rise.
  // Streak is counted in days (weekly habits: weeks x 7).
  thinning: [
    { minStreak: 0,  basePct: 1.00, bonusChance: 0.10 },
    { minStreak: 7,  basePct: 0.85, bonusChance: 0.16 },
    { minStreak: 21, basePct: 0.70, bonusChance: 0.22 },
    { minStreak: 45, basePct: 0.60, bonusChance: 0.30 }
  ],

  // Variable bonuses. "share" = how often this kind comes up among bonuses,
  // "mult" = extra points as a multiple of the habit's full weight.
  bonuses: [
    { id: 'crit',  name: 'Crit',         share: 0.60, mult: 1 },
    { id: 'chest', name: 'Vesicle',      share: 0.30, mult: 2 },
    { id: 'rare',  name: 'Rare isotope', share: 0.10, mult: 4 }
  ],

  clawback: {
    dayCap: 40,                       // most that one day can cost
    weekCap: 90,                      // most that any 7 days in a row can cost
    rollingDays: 7
  },

  repair: {
    rate: 0.60,                       // share of the clawed-back points one recovery action re-earns
    actions: [
      { id: 'hydrate', label: 'Drink 16 oz of water' },
      { id: 'walk',    label: 'Walk for 10 minutes' },
      { id: 'reflect', label: 'Write down what led to it' },
      { id: 'still',   label: 'Five extra minutes of mindfulness' }
    ]
  },

  // Growth stages. "at" = total points. "media: true" opens a film slot.
  stages: [
    { id: 'nucleotide',   phase: 'Strand',   name: 'Nucleotide',     at: 0 },
    { id: 'codon',        phase: 'Strand',   name: 'Codon',          at: 50 },
    { id: 'primer',       phase: 'Strand',   name: 'Primer',         at: 130 },
    { id: 'gene',         phase: 'Strand',   name: 'Gene',           at: 250 },
    { id: 'operon',       phase: 'Strand',   name: 'Operon',         at: 420 },
    { id: 'chromatin',    phase: 'Strand',   name: 'Chromatin',      at: 650 },
    { id: 'chromosome',   phase: 'Strand',   name: 'Chromosome',     at: 900 },
    { id: 'protocell',    phase: 'Cell',     name: 'Protocell',      at: 1200, media: true },
    { id: 'membrane',     phase: 'Cell',     name: 'Membrane',       at: 1550 },
    { id: 'nucleus',      phase: 'Cell',     name: 'Nucleus',        at: 1950 },
    { id: 'mitochondria', phase: 'Cell',     name: 'Mitochondria',   at: 2400 },
    { id: 'eukaryote',    phase: 'Cell',     name: 'Eukaryote',      at: 2900, media: true },
    { id: 'mitosis',      phase: 'Cell',     name: 'Mitosis',        at: 3450 },
    { id: 'colony',       phase: 'Organism', name: 'Colony',         at: 4050, media: true },

/* ------------------------------ helpers ---------------------------------- */
function clone(o) { return JSON.parse(JSON.stringify(o)); }

}

/* ------------------------------ data file -------------------------------- */

    settings: clone(DEFAULT_SETTINGS),
    habits: clone(DEFAULT_HABITS),
    routines: clone(DEFAULT_ROUTINES),
    log: [],          // every check-in, positive and negative
    ledger: [],       // every point movement, shared by all modules
    rolls: {},        // the dice already thrown for a habit on a day (so undo/redo cannot re-roll)
    milestones: [],   // stages reached and compounds completed
    traits: [],       // genes expressed: one permanent pick per stable week
    media: [],        // media index: one slot per milestone that earned art
    importedIds: [],  // import IDs already merged

    modules: { habits: { version: 1 }, nutrition: null }   // nutrition is reserved, not built

}

function normalize(d) {

function habitMap(data) { var m = {}; data.habits.forEach(function (h) { m[h.id] = h; }); return m; }

/* ------------------------------ stages ----------------------------------- */
function stageList(S, points) {

  var last = list[list.length - 1], n = 1;
  while (list[list.length - 1].at <= points + S.stageOverflowStep) {
    list.push({ id: 'generation-' + (n + 1), phase: last.phase, name: 'Generation ' + roman(n + 1), at: last.at + S.stageOverflowStep * n, media: n % S.stageOverflowMediaEvery === 0, overflow: true });

function thinTier(S, streakDays) { var t = S.thinning[0]; S.thinning.forEach(function (x) { if (streakDays >= x.minStreak) t = x; }); return t; }

  for (var i = 0; i < S.bonuses.length; i++) { acc += S.bonuses[i].share / tot; if (r < acc) return S.bonuses[i]; }

/* ------------------------------ genes (traits) --------------------------- */
/* fxAt: what the expressed genes add, counting only picks made on or before "date". */
function fxAt(data, date, asOf) {
  var fx = { levels: {}, shieldMaxAdd: 0, repairAdd: 0, bonus: {}, bondAdd: 0, moleculeAdd: 0 };
  (data.traits || []).forEach(function (p) {
    if (p.pickedOn > date || (asOf != null && p.seq > asOf)) return;
    var t = data.settings.traits.find(function (x) { return x.id === p.traitId; });
    fx.levels[p.traitId] = (fx.levels[p.traitId] || 0) + 1;
    if (!t || !t.effect) return;
    var e = t.effect;
    if (e.type === 'shieldMax') fx.shieldMaxAdd += e.per;
    else if (e.type === 'repairRate') fx.repairAdd += e.per;
    else if (e.type === 'bonusChance') fx.bonus[e.category] = (fx.bonus[e.category] || 0) + e.per;
    else if (e.type === 'bondPoints') fx.bondAdd += e.per;
    else if (e.type === 'moleculePoints') fx.moleculeAdd += e.per;

}
/* The offer for a week is fixed by that week's date, so reloading cannot re-deal it. */
function traitOffers(data, weekEnd, levels) {
  var open = data.settings.traits.filter(function (t) { return (levels[t.id] || 0) < t.max; });
  var seed = 0; for (var i = 0; i < weekEnd.length; i++) seed = (seed * 31 + weekEnd.charCodeAt(i)) | 0;
  var rng = mulberry32(seed ^ 0x9E3779B9), pool = open.slice(), out = [];
  while (pool.length && out.length < data.settings.traitOfferCount) out.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  return out;
}

/* ==========================================================================
   derive — rebuilds everything that can be rebuilt from the log and ledger:
   the strand, gaps, shields, chain, streaks, bonding, stage. The strand on
   screen is drawn from this and nothing else.
   opt.asOfSeq: rebuild the strand as it stood at an earlier moment.
   ========================================================================== */
function derive(data, today, opt) {
  opt = opt || {};
  var S = data.settings, asOf = opt.asOfSeq == null ? Infinity : opt.asOfSeq;
  var H = habitMap(data);
  var log = data.log.filter(function (e) { return e.seq <= asOf && e.date <= today; })
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq; });
  var rows = data.ledger.filter(function (r) { return r.seq <= asOf; });

  var first = log.length ? log[0].date : today;
  var days = [], byDate = {};
  for (var d = first; d <= today; d = addDays(d, 1)) {
    var day = { date: d, entries: [], pos: 0, neg: 0, done: {}, state: 'open', solid: false, stable: false, bonds: [], slots: [] };
    days.push(day); byDate[d] = day;
  }
  log.forEach(function (e) {
    var dy = byDate[e.date]; dy.entries.push(e);
    var h = H[e.habitId] || { id: e.habitId, sym: '?', category: 'health', hue: 0 };
    var repaired = e.kind === 'negative' && e.repair && e.repair.seq <= asOf;
    if (e.kind === 'negative') dy.neg++; else { dy.pos++; dy.done[e.habitId] = true; }
    dy.slots.push({
      t: e.kind === 'negative' ? (repaired ? 'repaired' : 'damaged') : 'pair',
      habitId: e.habitId, cat: h.category, logId: e.id, seq: e.seq,
      bonus: e.bonus ? e.bonus.type : null, amount: e.amount || null

  });

  var dailyByCat = {};
  data.habits.forEach(function (h) { if (h.kind === 'positive' && h.cadence === 'daily' && !h.archived) (dailyByCat[h.category] = dailyByCat[h.category] || []).push(h.id); });
  function isStable(dy) {
    var cats = Object.keys(dailyByCat); if (!cats.length) return false;
    return cats.every(function (c) {
      var ids = dailyByCat[c], need = Math.ceil(ids.length * S.stableDay.fractionPerCategory);
      return ids.filter(function (id) { return dy.done[id]; }).length >= need;
    });
  }

  var shields = S.shields.starting, chain = 0, bestChain = 0, bondedThrough = null, bondedWeeks = 0;
  var weeks = [], wk = null, shielded = [], gaps = [], stableDays = 0;
  days.forEach(function (dy) {
    var ws = weekStart(dy.date, S.weekStartsOn);
    if (!wk || wk.start !== ws) { wk = { start: ws, end: addDays(ws, 6), solid: 0, active: 0, stable: false, closed: false }; weeks.push(wk); }
    dy.weekStart = ws;
    var isToday = dy.date === today;
    if (dy.pos >= S.activeDay.minCheckins) { chain++; dy.state = 'active'; wk.active++; if (chain > bestChain) bestChain = chain; }
    else if (isToday) { dy.state = 'open'; }
    else if (chain > 0 && shields > 0) { shields--; dy.state = 'shielded'; shielded.push(dy.date); }
    else { chain = 0; dy.state = 'gap'; gaps.push(dy.date); }
    dy.solid = dy.pos >= S.stableWeek.solidDayMinCheckins; if (dy.solid) wk.solid++;
    dy.stable = isStable(dy); if (dy.stable) stableDays++;
    data.routines.forEach(function (r) { if (r.habits.length && r.habits.every(function (id) { return dy.done[id]; })) dy.bonds.push(r.id); });
    if (dy.date === wk.end && wk.end < today) {
      wk.closed = true; wk.stable = wk.solid >= S.stableWeek.minSolidDays;
      if (wk.stable) {
        var cap = S.shields.max + fxAt(data, wk.end, opt.asOfSeq).shieldMaxAdd;

    }

  var streaks = {};
  data.habits.forEach(function (h) {

      var count = {};

  var basePairs = 0, damaged = 0, repaired = 0;

    today: today, first: first, days: days, byDate: byDate, weeks: weeks,

    fx: { levels: fx.levels, bond: S.points.bond + fx.bondAdd, molecule: S.points.stableMolecule + fx.moleculeAdd, repairRate: Math.min(1, S.repair.rate + fx.repairAdd), bonus: fx.bonus },

/* ------------------------------ milestones ------------------------------- */

/* ==========================================================================
   checkIn — one tap. Positive habits earn; negative habits go to logNegative.
   ========================================================================== */
function checkIn(data, habitId, date, opt) {
  opt = opt || {};

  var now = opt.now || new Date().toISOString();
  var h = data.habits.find(function (x) { return x.id === habitId; });
  if (!h) return { error: 'Unknown habit: ' + habitId };
  if (!validDate(date)) return { error: 'Bad date: ' + date };
  if (date > today) return { error: 'That day has not happened yet.' };
  if (h.kind === 'negative') return logNegative(data, h, date, opt, today, now);

  if (data.log.some(function (e) { return e.habitId === habitId && e.date === date; })) return { error: h.short + ' is already logged for that day.', code: 'duplicate' };
  if (h.cadence === 'weekly' && !h.beyondTarget) {

    var n = data.log.filter(function (e) { return e.habitId === habitId && e.date >= ws && e.date <= we; }).length;

  }

    $('#gPlay').innerHTML = Guide.playing ? '<svg viewBox="0 0 20 20"><rect x="5" y="4" width="3.4" height="12" rx="1"/><rect x="11.6" y="4" width="3.4" height="12" rx="1"/></svg>' : '<svg viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z"/></svg>';
    $('#gPlay').setAttribute('aria-label', Guide.playing ? 'Pause' : 'Play');
    $('#gBar').innerHTML = Guide.chapters.map(function (x, i) { var f = i < Guide.ch ? 1 : i > Guide.ch ? 0 : (Guide.line + (done ? 1 : 0)) / x.lines.length; return '<button data-g="go" data-i="' + i + '" title="' + esc(x.title) + '"><i style="width:' + (f * 100) + '%"></i></button>'; }).join('');
    $('#gList').hidden = !Guide.listOpen;
    $('#gList').innerHTML = Guide.chapters.map(function (x, i) { return '<button data-g="go" data-i="' + i + '" aria-current="' + (i === Guide.ch) + '"><span>' + (i + 1) + '</span>' + esc(x.title) + '</button>'; }).join('');
    $('#gVoice').innerHTML = vs.length ? vs.map(function (v) { return '<option' + (cur && v.name === cur.name ? ' selected' : '') + '>' + esc(v.name) + '</option>'; }).join('') : '<option>No voice found: captions only</option>';
    $('#gRate').value = String(Guide.rate);

  },
  spot: function (c) {
    var sp = $('#spot'), el = null;
    c.target.split(',').some(function (sel) { el = $(sel.trim()); return el && el.offsetParent !== null; });
    if (el && el.closest('.card') && !el.matches('.card') && el.id !== 'left') el = el.closest('.card') || el;
    if (!el) { sp.classList.remove('on'); return; }
    if (Guide.lastEl !== el) { Guide.lastEl = el; el.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); }
    sp.classList.add('on');
  },
  track: function () {
    if (Guide.on && Guide.lastEl && $('#spot').classList.contains('on')) {
      var r = Guide.lastEl.getBoundingClientRect(), sp = $('#spot'), p = 8;
      sp.style.transform = 'translate(' + (r.left - p) + 'px,' + (r.top - p) + 'px)'; sp.style.width = (r.width + p * 2) + 'px'; sp.style.height = (r.height + p * 2) + 'px';
      var gd = $('#guide'); gd.style.setProperty('--gh', gd.offsetHeight + 'px'); gd.classList.toggle('up', r.top + r.height / 2 > innerHeight * 0.5);
    }

  },
  bind: function () {
    var g = $('#guide');
    g.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-g]'); if (!b) return; var k = b.dataset.g;
      if (k === 'play') Guide.playing ? Guide.pause() : Guide.play();
      else if (k === 'prev') Guide.go(Guide.line > 0 ? Guide.ch : Guide.ch - 1);
      else if (k === 'next') Guide.go(Guide.ch + 1);
      else if (k === 'go') Guide.go(+b.dataset.i);
      else if (k === 'list') { Guide.listOpen = !Guide.listOpen; Guide.render(); }
      else if (k === 'close') Guide.close();
    });
    $('#gVoice').addEventListener('change', function () { Guide.voiceName = this.value; try { localStorage.setItem('strand.guide.voice', this.value); } catch (e) {} if (Guide.playing) Guide.play(); });
    $('#gRate').addEventListener('change', function () { Guide.rate = +this.value; try { localStorage.setItem('strand.guide.rate', this.value); } catch (e) {} if (Guide.playing) Guide.play(); });
    if (Guide.syn) Guide.syn.onvoiceschanged = function () { if (Guide.on) Guide.render(); };
    window.addEventListener('beforeunload', function () { if (Guide.syn) Guide.syn.cancel(); });
    requestAnimationFrame(Guide.track);
  }
};

/* ============================== strand canvas ============================ */
var cv, ctx, mini, mctx, frames = 0, slow = 0, lastT = 0;
function resize() {
  var f = $('#field'), dpr = Math.min(2, window.devicePixelRatio || 1), W = f.clientWidth, H = f.clientHeight, v = st.v;
  v.W = W; v.H = H; v.dpr = dpr; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  var top = 46, bot = 112;
  v.amp = clamp((H - top - bot) / 2 - 12, 30, 122); v.cy = top + (H - top - bot) / 2 + 2;
  mini.width = Math.round(mini.clientWidth * dpr); mini.height = Math.round(mini.clientHeight * dpr);
  if (st.L) clampScroll();
}
function frame(now) {
  var v = st.v, t = (now - st.t0) / 1000, dt = now - lastT; lastT = now;
  if (!document.hidden && st.L) {
    if (!reduce) v.phase = 0.6 + t * 0.2;
    if (v.target != null) { v.scrollX += (v.target - v.scrollX) * 0.16; if (Math.abs(v.target - v.scrollX) < 0.5) { v.scrollX = v.target; v.target = null; } }
    else if (Math.abs(v.vel) > 0.15) { v.scrollX += v.vel; v.vel *= 0.92; clampScroll(); }
    v.ripples = v.ripples.filter(function (r) { return t - r.t0 < 1.4; });
    v.t = t; v.habits = st.habits; v.routines = st.routines; v.bondedThrough = st.D.bondedThrough; v.today = st.today; v.selected = st.sel;
    HX.draw(ctx, st.L, v);
    if (frames % 4 === 0) HX.mini(mctx, st.L, v, mini.clientWidth, mini.clientHeight, v.dpr);
    frames++; if (dt > 34) slow++; if (frames === 150) { if (slow > 60) v.bloom = false; }
  }
  requestAnimationFrame(frame);
}
function tipFor(p) {
  var D = st.D, tip = '';
  if (p.slot) {
    var s = p.slot.s, e = st.data.log.find(function (x) { return x.id === s.logId; }), hb = st.habits[s.habitId] || { name: s.habitId };
    tip = '<b>' + esc(hb.name) + '</b><br><span class="t2">' + shortDate(p.day.d.date) + '</span><br>';
    if (!e) return tip;
    if (s.t === 'pair') tip += '+' + e.points + ' base' + (e.bonus ? ', <span style="color:var(--gold)">+' + e.bonus.points + ' ' + esc(e.bonus.name.toLowerCase()) + '</span>' : '') + (e.streakAtLog >= 7 ? '<br><span class="t2">Run of ' + e.streakAtLog + ' days: thinner base, better bonus odds</span>' : '');
    else if (s.t === 'damaged') tip += '<span style="color:var(--lesion)">Damaged pair.</span> ' + plural(e.amount, e.unit) + ', −' + e.clawback.taken + ' clawed, +' + S().points.integrity + ' for logging it' + (e.loggedOn === st.today ? '<br><span class="t2">Repair is open today</span>' : '');
    else tip += '<span style="color:var(--gold)">Repaired pair.</span> ' + plural(e.amount, e.unit) + ', −' + e.clawback.taken + ' clawed, +' + e.repair.reearned + ' re-earned<br><span class="t2">' + esc(e.repair.label) + '</span>';
  } else if (p.day) {
    var d = p.day.d, bonded = D.bondedThrough && d.date <= D.bondedThrough;
    tip = '<b>' + longDate(d.date) + '</b><br>';
    if (d.state === 'shielded' && !d.slots.length) tip += '<span style="color:var(--frost)">A shield was spent here.</span> Nothing logged, chain kept.';
    else if (d.state === 'gap' && !d.slots.length) tip += 'Gap. Nothing logged and no shield left, so the chain restarted.';
    else if (!d.slots.length) tip += 'Nothing logged yet.';
    else tip += plural(d.slots.length, 'base pair') + (d.stable ? ', <span style="color:var(--gold)">stable molecule</span>' : '') + (d.bonds.length ? ', ' + plural(d.bonds.length, 'routine bond') : '');
    tip += '<br><span class="t2">' + (bonded ? 'Bonded for good' : 'Gains still loose') + '. Click to open the day.</span>';
  }
  return tip;
}
function bindCanvas() {
  var drag = null, moved = 0, tipEl = $('#tip');
  cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, sx: st.v.scrollX, last: e.clientX }; moved = 0; st.v.target = null; st.v.vel = 0; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', function (e) {
    var r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    if (drag) { var dx = e.clientX - drag.x; moved = Math.max(moved, Math.abs(dx)); st.v.scrollX = drag.sx - dx; st.v.vel = drag.last - e.clientX; drag.last = e.clientX; clampScroll(); tipEl.classList.remove('on'); return; }
    var p = HX.pick(st.L, st.v, mx, my), inBand = my > st.v.cy - st.v.amp - 36 && my < st.v.cy + st.v.amp + 60;
    st.v.hoverLog = p.slot ? p.slot.s.logId : null; st.v.hoverDate = p.day && inBand ? p.day.d.date : null;
    if (p.day && inBand) { tipEl.innerHTML = tipFor(p); tipEl.classList.add('on'); var tw = tipEl.offsetWidth; tipEl.style.left = clamp(mx + 16, 8, r.width - tw - 8) + 'px'; tipEl.style.top = Math.max(8, my - tipEl.offsetHeight - 14) + 'px'; }
    else tipEl.classList.remove('on');
  });
  function up(e) {
    cv.classList.remove('drag'); if (!drag) return; drag = null;
    if (moved < 5) { st.v.vel = 0; var r = cv.getBoundingClientRect(), p = HX.pick(st.L, st.v, e.clientX - r.left, e.clientY - r.top); if (p.day) selectDate(p.day.d.date); }
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', function () { drag = null; cv.classList.remove('drag'); });
  cv.addEventListener('pointerleave', function () { st.v.hoverLog = null; st.v.hoverDate = null; tipEl.classList.remove('on'); });
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) { var r = cv.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left); }
    else { st.v.target = null; st.v.scrollX += e.deltaX || e.deltaY; clampScroll(); }
  }, { passive: false });
  var md = false;
  function jump(e) { var r = mini.getBoundingClientRect(), fx = clamp((e.clientX - r.left) / r.width, 0, 1); st.v.target = null; st.v.scrollX = fx * st.L.width - st.v.W / 2; clampScroll(); }
  mini.addEventListener('pointerdown', function (e) { md = true; mini.setPointerCapture(e.pointerId); jump(e); });
  mini.addEventListener('pointermove', function (e) { if (md) jump(e); });
  mini.addEventListener('pointerup', function () { md = false; });
}
function zoom(k, atX) {
  var v = st.v, old = v.slotW, nw = clamp(old * k, 6, 34); if (nw === old) return;
  if (atX == null) atX = v.W / 2;
  var frac = (v.scrollX + atX) / Math.max(1, st.L.width);
  v.slotW = nw; v.dayGap = Math.max(4, Math.round(nw * 0.6)); relayout();
  v.target = null; v.scrollX = frac * st.L.width - atX; clampScroll();
}

/* ============================== boot ===================================== */
function dayTurnNotices(prev) {
  if (!prev || !prev.asOf || prev.asOf === st.today) return;
  var D = st.D;
  D.shieldedDates.filter(function (d) { return (prev.shieldedDates || []).indexOf(d) < 0 && d > prev.asOf; }).forEach(function (d) {
    toast('<b>A shield covered ' + shortDate(d) + '.</b> Nothing was logged that day, and your chain survived. ' + plural(D.shields, 'shield') + ' left.', 'frost', { ms: 12000 });
  });
  D.gapDates.filter(function (d) { return d > prev.asOf; }).slice(-1).forEach(function (d) { toast('<b>' + shortDate(d) + ' is a gap.</b> No shield was left, so the chain restarts today. Nothing you earned was lost.', '', { ms: 12000 }); });
  if (D.bondedThrough && (!prev.bondedThrough || D.bondedThrough > prev.bondedThrough)) toast('<b>Last week closed stable.</b> Its gains are bonded for good, and you earned a shield and a gene to express.', 'gold', { ms: 12000 });
  else { var lw = D.weeks.filter(function (w) { return w.closed; }).pop(); if (lw && lw.end >= prev.asOf && !lw.stable) toast('<b>Last week closed with ' + lw.solid + ' of ' + S().stableWeek.minSolidDays + ' solid days.</b> Its gains stay loose and carry into this week.', '', { ms: 12000 }); }
}
function boot2(silent) {
  var prev = st.data.derived;
  st.today = U.toISO(new Date()); st.sel = st.today;
  recompute(); st.shownPts = silent ? st.shownPts : 0;
  scrollToDate(st.today, true); renderAll();
  if (!silent) dayTurnNotices(prev);
  Media.scan();
}
function boot() {
  cv = $('#helix'); ctx = cv.getContext('2d'); mini = $('#mini'); mctx = mini.getContext('2d');
  try { Sfx.on = localStorage.getItem('strand.sound') !== 'off'; } catch (e) {}
  $('#soundBtn').setAttribute('aria-pressed', Sfx.on); $('#soundBtn').title = Sfx.on ? 'Sound is on' : 'Sound is off';
  Store.init().then(GH.init).then(function () {
    resize(); boot2(); Store.save(true); bindCanvas(); requestAnimationFrame(frame); GH.afterBoot();
    if (st.dirState === 'paused') toast('<b>Your data file needs one click.</b> The browser asks for permission once per visit.', '', { sticky: true, action: { label: 'Reconnect', fn: Store.reconnect } });
  });
  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('focus', GH.check);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') GH.check(); else if (GH.on() && GH.dirty() && GH.state === 'pending') GH.push(); });
  window.addEventListener('online', function () { if (GH.on() && GH.dirty() && GH.state !== 'conflict') GH.push(); });
  $('#left').addEventListener('click', function (ev) { var b = ev.target.closest('[data-habit]'); if (b) return tapHabit(b.dataset.habit, b); var a = ev.target.closest('[data-act]'); if (a) act(a.dataset.act, a); });
  $('#side').addEventListener('click', function (ev) { var a = ev.target.closest('[data-act]'); if (a) act(a.dataset.act, a); });
  $('#drawerBody').addEventListener('click', function (ev) { var a = ev.target.closest('[data-act]'); if (a) drawerAct(a.dataset.act, a); });
  $('#drawerBody').addEventListener('change', function (ev) { drawerChange(ev.target); });
  $$('.nav [data-open]').forEach(function (b) { b.addEventListener('click', function () { openDrawer(b.dataset.open); }); });
  $('#navGuide').addEventListener('click', function () { Sfx.init(); Guide.open(); }); Guide.bind();
  $('#gStart') && $('#gStart').addEventListener('click', function () { Guide.open(); });
  $('#stagebox').addEventListener('click', function () { openDrawer('vault'); });
  $('#geneChip').addEventListener('click', function () { var c = $('#geneCard'); if (!c) return; $('#side').scrollTop = 0; c.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); });
  $('#drawerClose').addEventListener('click', closeDrawer); $('#scrim').addEventListener('click', closeDrawer);
  $('#soundBtn').addEventListener('click', function () { Sfx.on = !Sfx.on; try { localStorage.setItem('strand.sound', Sfx.on ? 'on' : 'off'); } catch (e) {} this.setAttribute('aria-pressed', Sfx.on); this.title = Sfx.on ? 'Sound is on' : 'Sound is off'; if (Sfx.on) { Sfx.init(); Sfx.check(2); } });
  $('#zoomIn').addEventListener('click', function () { zoom(1.25); }); $('#zoomOut').addEventListener('click', function () { zoom(0.8); });
  $('#goToday').addEventListener('click', function () { selectDate(st.today); scrollToDate(st.today, false); st.v.target = clamp(st.L.byDate[st.today].x1 - st.v.W + 170, bounds()[0], bounds()[1]); });
  $('#clearSample').addEventListener('click', function () {
    modal('Clear the sample?', 'The fake entries go away and your own strand starts empty. Your settings stay.', [{ label: 'Clear the sample and start', cls: 'go', fn: function () {
      var keep = { settings: st.data.settings, habits: st.data.habits, routines: st.data.routines }; st.data = E.newData(); Object.assign(st.data, keep); st.mediaCache = {}; boot2(true); Store.save();
      toast('<b>Your strand starts here.</b> Tap your first atom.', 'gold');
    } }]);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (Guide.on) Guide.close(); else if ($('#cine').classList.contains('on')) closeCine(); else if ($('#modal').classList.contains('on')) $('#modal').classList.remove('on'); else if (st.drawer) closeDrawer(); }
  });
  setInterval(function () { var now = U.toISO(new Date()); if (now !== st.today) { var prev = st.data.derived; boot2(true); dayTurnNotices(prev); Store.save(); } }, 30000);
}
window.Strand = { gh: GH, guide: Guide, state: st, engine: E, modules: { habits: { id: 'habits', name: 'Habits' } }, registerModule: function (m) { window.Strand.modules[m.id] = m; } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
