<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spending</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%225%22%20fill%3D%22%2318202D%22%2F%3E%3Cpath%20d%3D%22M9%207v18h14%22%20fill%3D%22none%22%20stroke%3D%22%23E9E3D5%22%20stroke-width%3D%223.2%22%2F%3E%3Cpath%20d%3D%22M14%2019h9M14%2014h9%22%20stroke%3D%22%23C9B37A%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E">
<!-- Spending: the personal spending tracker that sits beside Strand (chadorleman.github.io/Strand/spending.html). One file, no server.
     Data lives in this browser and, once Strand's Data panel is connected to GitHub, in spending-data.json beside strand-data.json in the same private repo.
     Months older than the last 13 move to spending-archive-<year>.json in that repo. Sample data is invented and marked as sample.
     This repo is public: no real transactions, payees or personal rules belong in this file. -->
<style>
:root{
  --paper:#F3EEE3; --sunk:#EAE4D5; --sheet:#FAF7EF; --ink:#1B2534; --ink2:#4B5567; --ink3:#7F8796;
  --rule:#DAD3C2; --rule2:#C2B9A3; --accent:#1F5B4C; --on-accent:#F6F2E8; --red:#A33A2B; --gold:#9A7420;
  --spine:#18202D; --spine-ink:#E9E3D5; --spine-dim:#8E97A6; --shadow:0 1px 0 rgba(27,37,52,.04),0 12px 32px -18px rgba(27,37,52,.35);
  --serif:"Sitka Display","Sitka Heading","Sitka Text","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --paper:#141B26; --sunk:#0F151E; --sheet:#1A2331; --ink:#E9E3D5; --ink2:#AEB5C1; --ink3:#78818F;
  --rule:#293443; --rule2:#3B485A; --accent:#74BFA8; --on-accent:#0F151E; --red:#E58672; --gold:#D9B45A;
  --spine:#0D1219; --spine-ink:#E9E3D5; --spine-dim:#7A8493; --shadow:0 12px 32px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.num,.amt,td.r{font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.005em}
h2{font-size:22px;line-height:1.25}
h3{font-size:17px}
p{margin:0}
kbd{font:12px var(--sans);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--sheet);color:var(--ink2)}
.muted{color:var(--ink3)} .small{font-size:13px} .red{color:var(--red)} .green{color:var(--accent)}

/* shell */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100%}
.rail{background:var(--spine);color:var(--spine-ink);padding:26px 0 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 22px 22px;font:600 28px/1 var(--serif);letter-spacing:-.01em}
.brand small{display:block;font:13px var(--sans);color:var(--spine-dim);margin-top:6px;letter-spacing:0}
.nav button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:9px 22px;color:var(--spine-dim);text-align:left;border-left:3px solid transparent;font-size:15px}
.nav button:hover{color:var(--spine-ink)}
.nav button.on{color:var(--spine-ink);border-left-color:#C9B37A;background:rgba(255,255,255,.045)}
.nav .ct{font-size:12px;min-width:22px;text-align:center;padding:1px 6px;border-radius:9px;background:rgba(255,255,255,.1);color:var(--spine-ink)}
.nav .ct.hot{background:#C9B37A;color:#18202D;font-weight:600}
.rail-foot{margin-top:auto;padding:0 18px;display:grid;gap:10px}
.rail-foot .through{font-size:12px;color:var(--spine-dim);padding:0 4px}.rail-foot .through.bad{color:#E58672}.rail-foot .through:empty{display:none}
a.btn{text-decoration:none;color:inherit}
.rail .btn{border-color:rgba(255,255,255,.22);color:var(--spine-ink);background:none}
.rail .btn.pri{background:var(--spine-ink);color:var(--spine);border-color:var(--spine-ink)}
.rail-row{display:flex;gap:8px}.rail-row .btn{flex:1;padding:6px 0}
main{padding:34px 48px 90px;max-width:1240px;width:100%;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule2);border-radius:3px;padding:7px 13px;font-size:14px;background:var(--sheet);white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.quiet{border-color:transparent;background:none;color:var(--ink2)}
.btn.quiet:hover{color:var(--ink);border-color:var(--rule2)}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.field{border:1px solid var(--rule2);border-radius:3px;padding:7px 10px;background:var(--sheet);min-width:0}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
select.field{padding-right:4px}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;border:1px dashed var(--gold);color:var(--ink);background:color-mix(in srgb,var(--gold) 9%,var(--paper));padding:9px 14px;border-radius:3px;margin-bottom:26px;font-size:14px}
.banner b{color:var(--gold)}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.vhead h1{font-size:34px;line-height:1.1}
.vhead .tools{display:flex;gap:8px;flex-wrap:wrap}
.lede{font:400 19px/1.45 var(--serif);color:var(--ink2);max-width:46em;margin:-8px 0 26px}
section.blk{border-top:1px solid var(--rule);padding-top:20px;margin-top:34px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.blk-h p{color:var(--ink3);font-size:13px}
.empty{padding:46px 0;text-align:center;color:var(--ink2)}
.empty h2{margin-bottom:8px}
.empty .btn{margin-top:16px}

/* month */
.mnav{display:flex;align-items:center;gap:6px;font:600 17px var(--serif);color:var(--ink2)}
.mnav button{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule2);font-size:15px;line-height:1;color:var(--ink2)}
.mnav button:hover{border-color:var(--ink);color:var(--ink)}
.mnav span{min-width:150px;text-align:center}
.headline{font:500 clamp(27px,3.1vw,40px)/1.2 var(--serif);letter-spacing:-.012em;max-width:23em;margin:20px 0 28px;text-wrap:balance}
.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.fig{padding:14px 18px 14px 0;border-right:1px solid var(--rule);padding-left:18px}
.fig:first-child{padding-left:0}.fig:last-child{border-right:0}
.fig label{display:block;font-size:13px;color:var(--ink3)}
.fig b{display:block;font:600 30px/1.15 var(--serif);letter-spacing:-.01em}
.fig small{font-size:12.5px;color:var(--ink3)}
.fig.net b{display:inline-block;border-bottom:3px double var(--ink);padding-bottom:1px}
.pulse{display:flex;align-items:flex-end;gap:2px;height:74px;margin-top:26px;border-bottom:1px solid var(--rule2)}
.pulse button{flex:1;display:flex;align-items:flex-end;height:100%;position:relative}
.pulse i{display:block;width:100%;background:var(--ink);opacity:.78;min-height:1px;border-radius:1px 1px 0 0;transition:height .45s cubic-bezier(.2,.7,.2,1)}
.pulse button.we i{opacity:.45}
.pulse button:hover i{background:var(--accent);opacity:1}
.pulse-x{display:flex;gap:2px;font-size:11.5px;color:var(--ink3);margin-top:3px}
.pulse-x span{flex:1;text-align:center;overflow:visible;white-space:nowrap}
.notes{display:grid;gap:8px;margin-top:22px}
.note{display:flex;gap:10px;align-items:baseline;font-size:15px;padding-left:12px;border-left:3px solid var(--gold)}
.note.calm{border-left-color:var(--rule2);color:var(--ink2);font-family:var(--serif);font-size:16px}
.note button{color:var(--ink3);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.flow{width:100%;height:auto;display:block;overflow:visible}
.flow text{font:13px var(--sans);fill:var(--ink)}
.flow text.v{fill:var(--ink3);font-variant-numeric:tabular-nums}
.flow text.big{font:600 16px var(--serif)}
.flow .lk{opacity:.3;transition:opacity .15s}
.flow .src{fill:var(--ink);opacity:.1}
.flow g.c{cursor:pointer}
.flow g.c:hover .lk,.flow g.c:focus .lk{opacity:.62}
.flow.dim g.c:not(:hover) .lk{opacity:.14}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:48px}
.crow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 86px 58px;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.crow:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.crow .nm{display:flex;align-items:center;gap:8px;min-width:0}
.crow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .nm em{font-style:normal;font-size:11.5px;color:var(--ink3);border:1px solid var(--rule2);border-radius:2px;padding:0 4px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink3));flex:none;display:inline-block}
.bar{position:relative;height:9px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:1px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transition:left .5s cubic-bezier(.2,.7,.2,1)}
.crow .amt{text-align:right}
.crow .dl{text-align:right;font-size:12.5px;color:var(--ink3)}
.crow .dl.up{color:var(--red)} .crow .dl.dn{color:var(--accent)}
.legend{font-size:12.5px;color:var(--ink3);display:flex;gap:16px;margin-top:10px;align-items:center}
.legend b{display:inline-block;width:2px;height:14px;background:var(--ink);vertical-align:-3px;margin-right:6px}
.split-bar{display:flex;height:14px;border-radius:2px;overflow:hidden;margin:6px 0 12px;background:var(--sunk)}
.split-bar i{display:block;background:var(--ink);transition:width .5s}
.split-bar i+i{background:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14.5px}
.kv dt{color:var(--ink2);display:flex;align-items:center;gap:8px}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--ink);padding-top:5px;margin-top:3px;font-weight:600}
.kv dd.tot span{border-bottom:3px double var(--ink)}
.side h3{margin:0 0 8px}.side>div+div{margin-top:28px}

/* chips, picker */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);border-radius:11px;padding:1px 9px 1px 7px;font-size:13px;background:var(--sheet);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--ink2)}
.chip.none{border-style:dashed;color:var(--gold);padding-left:9px}
.chip .dot{width:8px;height:8px}
.tagc{font-size:12px;color:var(--ink2);background:var(--sunk);border-radius:2px;padding:0 5px;margin-left:6px}
#picker{position:absolute;z-index:75;width:270px;background:var(--sheet);border:1px solid var(--rule2);border-radius:4px;box-shadow:var(--shadow);padding:6px}
#picker input{width:100%;margin-bottom:4px}
.opts{max-height:300px;overflow:auto}
.opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:5px 8px;border-radius:3px;font-size:14px}
.opt .ic{width:20px;text-align:center;font-size:14px;filter:saturate(.6)}
.opt small{margin-left:auto;color:var(--ink3);font-size:12px}
.opt.hl{background:var(--ink);color:var(--paper)}.opt.hl small{color:inherit;opacity:.7}
.opt-sep{font-size:12px;color:var(--ink3);padding:6px 8px 2px}

/* triage */
.tri{max-width:640px;margin:0 auto}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.2,.7,.2,1)}
.prog-l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin:6px 0 22px}
.tcard{background:var(--sheet);border:1px solid var(--rule2);border-radius:4px;box-shadow:var(--shadow);padding:26px 30px 22px;position:relative;animation:slip .22s cubic-bezier(.2,.7,.2,1)}
@keyframes slip{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.tcard .when{font-size:13.5px;color:var(--ink3)}
.tcard .who{font:600 34px/1.15 var(--serif);margin:6px 0 2px;letter-spacing:-.01em}
.tcard .raw{font-size:12.5px;color:var(--ink3);letter-spacing:.02em}
.tcard .much{font:600 44px/1 var(--serif);margin-top:18px;font-variant-numeric:lining-nums}
.tcard .more{position:absolute;right:26px;top:24px;font-size:12.5px;color:var(--gold);border:1px solid currentColor;border-radius:10px;padding:1px 9px}
.tpick{margin-top:16px}
.tpick input.q{width:100%;font-size:17px;padding:10px 12px}
.tpick .opts{max-height:none;columns:2;column-gap:10px;margin-top:8px}.tpick .opt{break-inside:avoid}
.trow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13.5px;color:var(--ink2);gap:14px;flex-wrap:wrap}
.trow label{display:flex;gap:7px;align-items:center;cursor:pointer}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}

/* transactions */
.search{display:flex;gap:10px;align-items:center}
.search input.q{flex:1;font-size:16px;padding:10px 13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0 4px;font-size:13px}
.pill{border:1px solid var(--rule2);border-radius:12px;padding:2px 11px;font-size:13px;color:var(--ink2);background:none}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill .x{margin-left:6px;opacity:.6}
.filters input[type=date]{padding:2px 6px;font-size:13px}
.txsum{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;color:var(--ink2);padding:12px 0 8px;border-bottom:1px solid var(--ink)}
.bulk{position:sticky;top:8px;z-index:20;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:4px;margin:8px 0;font-size:14px;box-shadow:var(--shadow)}
.bulk .btn{background:none;border-color:rgba(255,255,255,.3);color:inherit}[data-theme=dark] .bulk .btn{border-color:rgba(0,0,0,.3)}
.bulk span{margin-right:auto}
.tx{display:grid;grid-template-columns:22px 74px minmax(0,1fr) 150px minmax(0,190px) 96px 26px;gap:12px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--rule);font-size:14.5px}
.tx:hover{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
.tx.cur{box-shadow:inset 3px 0 0 var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tx.sel{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.tx .d{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.tx .m{min-width:0}
.tx .m button{font-weight:600;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.tx .m .rawl{display:none;font-size:12px;color:var(--ink3);letter-spacing:.02em;word-break:break-all}
.tx.open .m .rawl{display:block}
.tx .nt{font-size:12.5px;color:var(--ink2);font-style:italic;margin-left:8px}
.tx .ac{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{text-align:right;font-variant-numeric:tabular-nums}.tx .a.in{color:var(--accent)}
.tx .more{color:var(--ink3);font-size:18px;line-height:1}
.tx[draggable=true]{cursor:grab}
#dock{position:fixed;left:212px;right:0;bottom:0;z-index:50;background:var(--spine);padding:14px 20px;display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
body.dragging #dock{display:grid}
.tile{border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:9px 10px;color:var(--spine-ink);font-size:13.5px;display:flex;gap:8px;align-items:center}
.tile.over{background:var(--c);border-color:var(--c);color:#fff}

/* drawer + modal + toast */
#drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:var(--sheet);border-left:1px solid var(--rule2);box-shadow:var(--shadow);z-index:40;padding:26px 28px;overflow:auto;transform:translateX(105%);transition:transform .22s cubic-bezier(.2,.7,.2,1)}
#drawer.on{transform:none}
#drawer h2{font-size:26px;margin:4px 0}
.frm{display:grid;gap:12px;margin-top:18px}
.frm label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.frm .row,.frm.row{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:3px;overflow:hidden}
.seg button{padding:5px 11px;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.sp-line{display:grid;grid-template-columns:1fr 100px 24px;gap:8px;align-items:center}
#modal{position:fixed;inset:0;z-index:70;background:rgba(15,20,28,.5);display:none;align-items:flex-start;justify-content:center;padding:8vh 20px;overflow:auto}
#modal.on{display:flex}
.mbox{background:var(--sheet);border-radius:5px;box-shadow:var(--shadow);padding:26px 30px;width:560px;max-width:100%}
.mbox.wide{width:820px}
.mbox h2{margin-bottom:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:4px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);animation:rise .2s ease-out}
.toast button{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.toast.bad{background:var(--red);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#dropveil{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--spine) 88%,transparent);color:var(--spine-ink);display:none;align-items:center;justify-content:center;font:600 34px var(--serif);border:3px dashed #C9B37A}
body.filedrag #dropveil{display:flex}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-weight:500;font-size:13px;color:var(--ink3);text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--ink)}
td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
th.r,td.r{text-align:right;padding-right:0;padding-left:14px}
tr.total td{border-top:1px solid var(--ink);border-bottom:0;font-weight:600}
tr.total td.r span{border-bottom:3px double var(--ink)}
td input.field,td select.field{padding:4px 7px;font-size:14px}

/* year */
.yr{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:end;height:220px;border-bottom:1px solid var(--rule2)}
.yr button{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.yr i{display:block;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.yr i.fx{background:var(--ink)}.yr i.fl{background:var(--accent)}.yr i.cr{background:var(--red)}
.yr button:hover i{filter:brightness(1.18)}
.yr-x{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;font-size:12.5px;color:var(--ink3);text-align:center;margin-top:5px}
.yr-x b{display:block;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.key{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:1px}

<script>
/* ===== Ledger core: data logic, no DOM ===== */
const Core = (function () {
'use strict';

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
let _n = 0;
const uid = p => (p || '') + Date.now().toString(36) + (++_n).toString(36) + Math.floor(Math.random() * 1296).toString(36);

/* ---------- dates (ISO strings, UTC math) ---------- */
const D = iso => new Date(iso + 'T00:00:00Z');

const diffDays = (a, b) => Math.round((D(a) - D(b)) / 864e5);
const ymOf = s => s.slice(0, 7);
const ymAdd = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n - 1; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + String(m + 1).padStart(2, '0'); };

const addMonths = (s, n) => { const ym = ymAdd(ymOf(s), n); const day = Math.min(+s.slice(8), daysInMonth(ym)); return ym + '-' + String(day).padStart(2, '0'); };
const ymLabel = ym => MONTHS[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4);
const ymShort = ym => MON[+ym.slice(5) - 1] + ' ’' + ym.slice(2, 4);
const fmtDate = (s, long) => MON[+s.slice(5, 7) - 1] + ' ' + (+s.slice(8)) + (long ? ', ' + s.slice(0, 4) : '');
const dow = s => D(s).getUTCDay();

function parseDate(v) {

/* ---------- money (integer cents) ---------- */
function parseMoney(v) {

  let s = String(v).trim(); if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) neg = true;
  if (s.indexOf('-') >= 0) neg = true;
  s = s.replace(/[^0-9.]/g, '');
  if (!s || isNaN(+s)) return null;
  const c = Math.round(parseFloat(s) * 100);

}
function fmt(c, o) {

const dollars = c => Math.round(c) / 100;

/* ---------- CSV ---------- */
function parseCSV(text) {

  const first = text.split(/\r?\n/).find(l => l.trim()) || '';

  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }

}
const csvCell = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');

/* ---------- merchant cleanup ---------- */
const STATES = new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC'.split(' '));
const CITY_LEAD = new Set('FORT FT MINT ROCK INDIAN MT MOUNT SAINT ST NEW NORTH SOUTH WEST EAST LAKE KINGS WINSTON SAN LOS LAS PORT CAPE HIGH'.split(' '));
const KEEP_UP = new Set('QT ABC CVS BP USA UPS USPS ATM HVAC BBQ LLC AT&T IHOP KFC TJ DSW REI AMC H&M IKEA NC SC'.split(' '));
const ALIASES = [[/^(AMAZON|AMZN)\b(?!.*(PRIME|STORE ?CA?RD))/, 'Amazon'], [/^(WAL-?MART|WM SUPERCENTER)/, 'Walmart'], [/^TARGET\b/, 'Target'], [/^COSTCO/, 'Costco'], [/^UBER ?\*? ?EATS/, 'Uber Eats'], [/^UBER\b/, 'Uber'], [/^LYFT\b/, 'Lyft']];
function cleanMerchant(raw) {
  let s = String(raw || '').toUpperCase().trim();
  const cols = s.split(/\s{2,}/);               // fixed-width exports: merchant, then city columns
  if (cols.length > 1 && cols[0].replace(/[^A-Z]/g, '').length >= 3) s = cols[0];
  s = s.replace(/\s+/g, ' ');
  s = s.replace(/^(?:TST\*|SQ ?\*|LINK\*|SP \*?|PY ?\*|PP ?\*|PAYPAL ?\*|IN \*|FS ?\*|WPY\*|EB ?\*|BT\*|CKO\*|TCB\*|POS (?:DEBIT|PURCHASE) ?-?|DEBIT CARD PURCHASE ?-?|CHECKCARD \d* ?|PURCHASE AUTHORIZED ON \S+ ?|ACH (?:DEBIT|WITHDRAWAL) ?-?)\s*/, '');
  s = s.replace(/\*\S*\d\S*/g, ' ').replace(/\b\d{3}[-.]\d{3}[-.]\d{4}\b/g, ' ').replace(/\bX{2,}\d+\b/g, ' ').replace(/#\s?\d+/g, ' # ').replace(/\b\d{4,}\b/g, ' # ').replace(/\s+/g, ' ').trim();
  let w = s.split(' ');
  if (w.length > 1 && STATES.has(w[w.length - 1])) {
    w.pop();
    const cut = w.lastIndexOf('#') >= 1 ? w.lastIndexOf('#') : w.findIndex((x, i) => i >= 1 && /^\d+$/.test(x));
    if (cut >= 1) w = w.slice(0, cut);

    if (KEEP_UP.has(x)) return x;
    if (/\.(COM|NET|ORG|IO|CO)\b/.test(x)) return x.toLowerCase();

}
const mkey = m => String(m || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const normDesc = raw => String(raw || '').toUpperCase().replace(/[^A-Z0-9]+/g, '');

/* ---------- seed ---------- */
const SEED_CATS = [
  ['giving', 'Giving', '#7B5EA7', '🕊', true, 'Giving', 'spend'],
  ['housing', 'Housing', '#4E6E96', '🏠', true, 'Housing', 'spend'],
  ['auto-loan', 'Auto — Loan', '#2F7F8C', '🚗', true, 'Transportation', 'spend'],
  ['auto-fuel', 'Auto — Fuel & Care', '#5B9A94', '⛽', false, 'Transportation', 'spend'],
  ['groceries', 'Groceries', '#5C8F4A', '🧺', false, 'Food', 'spend'],
  ['dining', 'Dining', '#C98A2B', '🍽', false, 'Food', 'spend'],
  ['coffee', 'Coffee', '#8E6744', '☕', false, 'Food', 'spend'],
  ['health', 'Health', '#B4526E', '➕', false, 'Health', 'spend'],
  ['insurance', 'Insurance', '#6C80AE', '🛡', true, 'Insurance', 'spend'],
  ['subs', 'Subscriptions & Apps', '#8D72BD', '🔁', true, 'Subscriptions', 'spend'],
  ['pets', 'Pets', '#B3902F', '🐾', false, 'Household', 'spend'],
  ['home', 'Home', '#7F9140', '🛠', false, 'Household', 'spend'],
  ['clothing', 'Clothing', '#A85F92', '👕', false, 'Lifestyle', 'spend'],
  ['travel', 'Travel & Events', '#2E8CA6', '🎟', false, 'Lifestyle', 'spend'],
  ['fees', 'Fees & Interest', '#A8402F', '％', false, 'Cost of credit', 'spend', 1],
  ['cashadv', 'Cash Advances', '#7C3232', '🏧', false, 'Cost of credit', 'spend', 1],
  ['income', 'Income', '#2F6F52', '＋', false, 'Income', 'income'],
  ['transfers', 'Transfers & Card Payments', '#8B8B82', '⇄', false, 'Excluded', 'transfer'],

const SEED_RULES = [
  ['INTEREST CHARGE|FINANCE CHARGE', 'fees', '', ''],
  ['LATE FEE|ANNUAL FEE|RETURNED PAYMENT FEE|FOREIGN TRANSACTION FEE', 'fees', '', ''],
  ['CASH ADVANCE', 'cashadv', '', ''],
  ['PAYMENT RECEIVED|PAYMENT THANK YOU|PAYMENT - THANK YOU|AUTOPAY PAYMENT|ONLINE PAYMENT|MOBILE PAYMENT|ELECTRONIC PAYMENT|INTERNET PAYMENT', 'transfers', '', 'Card payment'],
];
function freshState() {
  return {
    app: 'ledger-spending-tracker', version: 1,
    accounts: [], txns: [], imports: [],
    cats: SEED_CATS.map(c => ({ id: c[0], name: c[1], color: c[2], icon: c[3], fixed: c[4], group: c[5], kind: c[6], credit: !!c[7], parent: null, arch: false })),
    rules: SEED_RULES.map((r, i) => ({ id: 'seed' + i, pattern: r[0], cat: r[1], tag: r[2], rename: r[3], on: true })),
    rec: {}, budget: { income: null, targets: {} }, saved: [], maps: {}, recent: [],
    settings: { theme: null, sample: false, subsReviewed: null, keepMonths: 13 },
    meta: { rev: 0, updatedAt: null },              // rev rises on every save (GitHub sync uses it)
    archive: { before: null, years: {} },           // transactions dated before "before" live in spending-archive-<year>.json
  };
}

/* ---------- rules ---------- */
function compileRule(r) {
  const alts = String(r.pattern || '').split('|').map(s => s.trim().toUpperCase()).filter(Boolean);
  if (!alts.length) return null;
  const parts = alts.map(a => {
    const e = a.replace(/[.*+?^${}()|[\]\\\/\-]/g, '\\$&').replace(/\s+/g, '\\s*');
    return a.replace(/[^A-Z0-9]/g, '').length <= 3 ? '(?:^|[^A-Z0-9])' + e + '(?:[^A-Z0-9]|$)' : e;

  const a = String(raw || '').toUpperCase(), b = String(merchant || '').toUpperCase();

const HINTS = [

  [/grocer|supermarket/i, 'groceries'], [/coffee/i, 'coffee'], [/gas|automotive|fuel/i, 'auto-fuel'],
  [/health|medical|pharm/i, 'health'], [/insurance/i, 'insurance'], [/pet/i, 'pets'],
  [/airfare|lodging|hotel|travel|car rental|entertainment/i, 'travel'], [/cloth|apparel/i, 'clothing'],
  [/home|furnish|hardware/i, 'home'], [/subscription|streaming|software/i, 'subs'], [/charit|donat|giving/i, 'giving'],
  [/utilit|phone|cable|internet|rent|mortgage/i, 'housing'],

  if (byName) return byName.id;

/* ---------- flow diagram: money in, to fixed and flexible, to categories ---------- */
function flowSVG(ym) {
  const M = IX.months[ym]; if (!M || M.out <= 0) return '<p class="muted">No spending this month.</p>';
  const cs = Object.entries(M.cats).filter(([id, e]) => e.total > 0).map(([id, e]) => { const fx = Math.max(0, Math.min(e.total, e.fixed)); return { id, name: Core.catName(IX, id), color: id === UN ? '#9A9A90' : cat(id).color, v: e.total, fx, fl: e.total - fx, side: fx >= e.total - fx ? 0 : 1 }; });
  cs.sort((a, b) => a.side - b.side || b.v - a.v);
  const out = cs.reduce((s, c) => s + c.v, 0), fixed = cs.reduce((s, c) => s + c.fx, 0), flex = out - fixed;
  const income = Math.max(0, M.income), left = Math.max(0, income - out), short = income > 0 ? Math.max(0, out - income) : 0;
  const right = cs.slice(); if (left > 0) right.push({ id: '_left', name: 'Left over', color: 'var(--accent)', v: left, fx: 0, fl: 0, side: 2 });
  const W = 1000, GAP = 7, MINL = 21, n = right.length, H = Math.max(330, n * 28), NW = 12, X1 = 405, X2 = 780;
  let lo = 0, hi = H / (out + left);
  for (let i = 0; i < 40; i++) { const s = (lo + hi) / 2, need = right.reduce((a, r) => a + Math.max(r.v * s, MINL), 0) + GAP * (n - 1); if (need > H) hi = s; else lo = s; }
  const s = lo; let y = 0;
  right.forEach(r => { r.h = Math.max(r.v * s, 1.5); const slot = Math.max(r.h, MINL); r.y = y + (slot - r.h) / 2; y += slot + GAP; });
  const totalH = y - GAP, MG = 30;
  const mids = [{ id: 'fx', name: 'Fixed', v: fixed, fill: 'var(--ink)' }, { id: 'fl', name: 'Flexible', v: flex, fill: 'var(--ink2)' }, { id: 'lo', name: 'Left over', v: left, fill: 'var(--accent)' }].filter(m => m.v > 0);
  let my = Math.max(0, (totalH - (mids.reduce((a, m) => a + m.v * s, 0) + MG * (mids.length - 1))) / 2);
  mids.forEach(m => { m.h = m.v * s; m.y = my; m.o = 0; m.i = 0; my += m.h + MG; });
  const srcs = income > 0 ? [{ name: 'Income', v: income, fill: 'var(--accent)' }].concat(short > 0 ? [{ name: 'From savings or credit', v: short, fill: 'var(--red)' }] : []) : [{ name: 'Money out', v: out, fill: 'var(--ink)' }];
  let sy = Math.max(0, (totalH - (srcs.reduce((a, x) => a + x.v * s, 0) + MG * (srcs.length - 1))) / 2);
  srcs.forEach(x => { x.h = x.v * s; x.y = sy; x.o = 0; sy += x.h + MG; });
  const band = (x0, y0, x1, y1, h) => { const xm = (x0 + x1) / 2, f = v => v.toFixed(1); return `M${x0},${f(y0)}C${xm},${f(y0)} ${xm},${f(y1)} ${x1},${f(y1)}L${x1},${f(y1 + h)}C${xm},${f(y1 + h)} ${xm},${f(y0 + h)} ${x0},${f(y0 + h)}Z`; };
  let g1 = '', g2 = '', si = 0, rem = srcs[0].v;
  mids.forEach(m => { let need = m.v, guard = 0; while (need > 0.5 && si < srcs.length && guard++ < 9) { const take = Math.min(need, rem), src = srcs[si], h = take * s; g1 += `<path class="src" d="${band(NW, src.y + src.o, X1, m.y + m.i, h)}"/>`; src.o += h; m.i += h; need -= take; rem -= take; if (rem <= 0.5) { si++; rem = si < srcs.length ? srcs[si].v : 0; } } });
  const mid = id => mids.find(m => m.id === id);
  right.forEach(r => {
    let parts = '', ry = r.y;
    const link = (m, v) => { if (!m || v <= 0) return; const h = Math.max(v * s, 1); parts += `<path class="lk" fill="${r.color}" d="${band(X1 + NW, m.y + m.o, X2, ry, h)}"/>`; m.o += v * s; ry += v * s; };
    if (r.id === '_left') link(mid('lo'), r.v); else { link(mid('fx'), r.fx); link(mid('fl'), r.fl); }
    const cy = r.y + r.h / 2 + 4.5, share = Math.round(r.v / (out || 1) * 100);

function parseQ(q) {

  for (const tk of toks) {

    else if ((m = tk.match(/^\$?(\d+(?:\.\d+)?)-\$?(\d+(?:\.\d+)?)$/))) { const lo = Math.round(+m[1] * 100), hi = Math.round(+m[2] * 100); f.tests.push(t => { const a = Math.abs(t.amt); return a >= lo && a <= hi; }); }

      if (k === 'cat') { const exact = names.includes(v); f.tests.push(t => Core.linesOf(t).some(l => { const n = Core.catName(IX, l.cat || UN).toLowerCase(); return exact ? n === v : n.includes(v); })); }
      else if (k === 'tag') f.tests.push(t => t.tags.some(x => x.toLowerCase() === v));
      else if (k === 'acct') f.tests.push(t => acctLabel(ACC[t.acct]).toLowerCase().includes(v));
      else if (v === 'uncat') f.tests.push(t => !t.cat && !(t.sp && t.sp.length));
      else if (v === 'fixed' || v === 'flex') f.tests.push(t => { const c = cat(t.cat); return (!c || c.kind === 'spend') && IX.isFixed(t, c) === (v === 'fixed'); });

      S.txns.forEach(t => { if (t.cat === from.id) t.cat = to.id; if (t.sp) t.sp.forEach(s => { if (s.cat === from.id) s.cat = to.id; }); });
      S.rules.forEach(r => { if (r.cat === from.id) r.cat = to.id; });
      if (S.budget.targets[from.id]) { S.budget.targets[to.id] = (S.budget.targets[to.id] || 0) + S.budget.targets[from.id]; delete S.budget.targets[from.id]; }
      S.cats.forEach(c => { if (c.parent === from.id) c.parent = null; }); S.recent = S.recent.filter(x => x !== from.id); S.cats = S.cats.filter(c => c.id !== from.id);
    }));
  });
};
CH.rPattern = el => { const v = el.value.trim(); if (v) soft('Rule updated', () => Rl(el.dataset.id).pattern = v.toUpperCase()); };
CH.rRename = el => soft('Rule updated', () => Rl(el.dataset.id).rename = el.value.trim());
CH.rTag = el => soft('Rule updated', () => Rl(el.dataset.id).tag = el.value.trim().toLowerCase());
A.rCat = el => openPicker(el, v => act('Rule updated', () => Rl(el.dataset.id).cat = resolvePick(v)));
A.rDel = el => act('Deleted rule', () => S.rules = S.rules.filter(r => r.id !== el.dataset.id));
function confirmRule(r) { const n = ruleTargets(r).length; if (!n) return toast('Nothing in the past needs changing.'); confirmBox('Apply this rule to the past?', 'This rule will move ' + n + ' past ' + (n === 1 ? 'transaction' : 'transactions') + ' to ' + esc(cat(r.cat).name) + '.', 'Move ' + n, () => act('Rule applied to ' + n, () => applyRule(Rl(r.id)))); }
A.rApply = el => confirmRule(Rl(el.dataset.id));
A.rAdd = el => { const p = $('#newRule').value.trim(); if (!p) return toast('Type the text to match first.'); openPicker(el, v => { let r; act('Rule added', () => { r = addRule(p, resolvePick(v)); }); if (ruleTargets(r).length) confirmRule(r); }); };
CH.aName = el => { const v = el.value.trim(); if (v) soft('Account renamed', () => Ac(el.dataset.id).name = v); };
CH.aLast4 = el => soft('Account updated', () => Ac(el.dataset.id).last4 = el.value.replace(/\D/g, '').slice(0, 4));
CH.aType = el => soft('Account updated', () => Ac(el.dataset.id).type = el.value);
A.iDel = el => { const i = S.imports.find(x => x.id === el.dataset.id), n = S.txns.filter(t => t.src === i.id).length; confirmBox('Remove this import?', n + ' transactions from ' + esc(i.file) + ' will be removed. Your categories and rules stay.', 'Remove ' + n, () => act('Removed import', () => { S.txns = S.txns.filter(t => t.src !== i.id); S.imports = S.imports.filter(x => x.id !== i.id); if (i.smp) Core.clearSample(S); })); };

/* ---------- exports ---------- */
let feedScope = 'month';
A.feed = () => {
  const months = feedScope === 'month' ? [ui.ym] : IX.list, feeds = months.map(ym => Core.feedMonth(S, IX, ym));
  const errs = feeds.flatMap(f => Core.validateFeed(f).map(e => f.month + ': ' + e)), b = feeds[feeds.length - 1].averages_basis;
  modal(`<h2>Export for the budget maker</h2>
  <div class="seg" style="margin:6px 0 14px"><button class="${feedScope === 'month' ? 'on' : ''}" data-a="feedScope" data-s="month">${ymLabel(ui.ym)}</button><button class="${feedScope === 'all' ? 'on' : ''}" data-a="feedScope" data-s="all">All ${IX.list.length} months</button></div>
  <p>${errs.length ? '<span class="red">Check failed: ' + esc(errs.join('; ')) + '</span>' : 'Checked against the contract. Totals match the month page to the cent.'}</p>
  <p class="small muted" style="margin-top:8px">The file is a list with one object per month. Averages cover the months before each month${b.full_window ? '.' : ', and the newest month has ' + b.months_available + ' of 12 months of history behind it, which the file states.'}</p>
  <div class="mfoot"><button class="btn" data-a="closeModal">Close</button><button class="btn" data-a="feedCsv">Download flat CSV</button><button class="btn pri" data-a="feedGo" autofocus>Download feed and summary</button></div>`);
};
A.feedScope = el => { feedScope = el.dataset.s; A.feed(); };
const feedData = () => { const months = feedScope === 'month' ? [ui.ym] : IX.list; return { feeds: months.map(ym => Core.feedMonth(S, IX, ym)), tag: months.length === 1 ? months[0] : months[0] + '_to_' + months[months.length - 1] }; };
A.feedGo = () => { const d = feedData(); download('budget-feed-' + d.tag + '.json', JSON.stringify(d.feeds, null, 2), 'application/json'); setTimeout(() => download('budget-feed-summary-' + d.tag + '.md', Core.feedSummary(d.feeds), 'text/markdown'), 400); toast('Feed and summary downloaded'); };
A.feedCsv = () => { const d = feedData(); download('budget-feed-' + d.tag + '.csv', Core.feedCSV(d.feeds), 'text/csv'); };
A.csvAll = () => download('transactions-all.csv', txCSV(S.txns), 'text/csv');
A.backup = () => { saveNow(); download('ledger-backup-' + todayISO() + '.json', JSON.stringify(S), 'application/json'); toast('Backup downloaded'); };
A.restore = () => $('#restore').click();
async function restoreFile(f) {
  let o; try { o = JSON.parse(await f.text()); } catch (e) { return toast('That file is not a Ledger backup.', { bad: 1 }); }
  if (!o || o.app !== 'ledger-spending-tracker' || !Array.isArray(o.txns)) return toast('That file is not a Ledger backup.', { bad: 1 });
  confirmBox('Restore this backup?', 'It holds ' + o.txns.length.toLocaleString() + ' transactions, ' + o.rules.length + ' rules and ' + o.cats.length + ' categories. It replaces what is here now.', 'Restore backup', () => { ui.tri = null; ui.ym = null; act('Restored backup', () => { S = o; normalize(); }); });
}
A.erase = () => confirmBox('Erase everything?', 'All transactions, rules, plans and decisions are removed from this browser. Download a backup first if you might want them.', 'Erase everything', () => { ui.ym = null; ui.tri = null; act('Erased everything', () => { S = Core.freshState(); }); }, 1);

/* ---------- events ---------- */
function moveCur(d) { if (!curList.length) return; ui.cur = Math.max(0, Math.min(curList.length - 1, ui.cur + d)); if (ui.cur >= ui.limit) ui.limit = ui.cur + 100; drawTx(); const r = $('.tx.cur'); if (r) r.scrollIntoView({ block: 'nearest' }); }
function wire() {
  document.addEventListener('click', e => {
    if (pick && !e.target.closest('#picker') && !e.target.closest('[data-a="pick"],[data-a="bulkCat"],[data-a="rCat"],[data-a="spCat"],[data-a="cMerge"],[data-a="rAdd"]')) closePicker();
    if (e.target.id === 'modal') return closeModal();
    const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    const fn = A[el.dataset.a]; if (fn) fn(el, e);
  });
  document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.c; if (k && CH[k]) CH[k](e.target, e); });
  $('#file').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) importFiles(fs); });
  $('#restore').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreFile(f); });
  // file drop anywhere
  let depth = 0; const isFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (isFiles(e)) { depth++; document.body.classList.add('filedrag'); } });
  window.addEventListener('dragleave', e => { if (isFiles(e) && --depth <= 0) { depth = 0; document.body.classList.remove('filedrag'); } });
  window.addEventListener('dragover', e => { if (isFiles(e) || e.target.closest('.tile')) e.preventDefault(); });
  window.addEventListener('drop', e => { if (isFiles(e)) { e.preventDefault(); depth = 0; document.body.classList.remove('filedrag'); importFiles([...e.dataTransfer.files]); } });
  // drag a row onto a category tile
  let dragIds = null;
  document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('.tx'); if (!r) return; const id = r.dataset.id; dragIds = ui.sel.has(id) ? [...ui.sel] : [id]; e.dataTransfer.setData('text/plain', TX.get(id).m); e.dataTransfer.effectAllowed = 'move'; $('#dock').innerHTML = dockHTML(); setTimeout(() => document.body.classList.add('dragging'), 0); });
  document.addEventListener('dragend', () => { document.body.classList.remove('dragging'); dragIds = null; });
  const dock = $('#dock');
  dock.addEventListener('dragover', e => { const t = e.target.closest('.tile'); $$('.tile.over', dock).forEach(x => x !== t && x.classList.remove('over')); if (t) { t.classList.add('over'); e.preventDefault(); } });
  dock.addEventListener('dragleave', e => { const t = e.target.closest('.tile'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('over'); });
  dock.addEventListener('drop', e => { const t = e.target.closest('.tile'); if (!t || !dragIds) return; e.preventDefault(); const ids = dragIds; document.body.classList.remove('dragging'); dropOnCat(ids, t.dataset.cat); });
  document.addEventListener('keydown', e => {
    const tg = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(tg.tagName) || tg.isContentEditable, modalOn = $('#modal').classList.contains('on');
    if (e.key === 'Escape') { if (pick) return closePicker(); if (modalOn) return closeModal(); if (ui.drawer) return closeDrawer(); if (typing) tg.blur(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); return undo(); }
    if ((e.key === 'Enter' || e.key === ' ') && tg.matches && tg.matches('g[role=button][data-a]')) { e.preventDefault(); return A[tg.dataset.a](tg, e); }
    if (typing || modalOn || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === '/') { e.preventDefault(); if (ui.view !== 'tx') go('tx'); const q = $('#q'); q.focus(); q.select(); return; }
    if (k === '?') { e.preventDefault(); return A.keys(); }
    if (/^[1-7]$/.test(k)) { e.preventDefault(); return go(VIEWS[+k - 1][0], VIEWS[+k - 1][0] === 'inbox' ? { tri: null } : null); }
    if (k === '[' || k === ']') { if (ui.view !== 'month' && ui.view !== 'budget') return; return shiftMonth(k === '[' ? -1 : 1); }
    if (k === 'i') { e.preventDefault(); return A.import(); }
    if (ui.view !== 'tx') return;
    if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); return moveCur(1); }
    if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); return moveCur(-1); }
    const t = curList[ui.cur]; if (!t) return;
    if (k === 'x') { ui.sel.has(t.id) ? ui.sel.delete(t.id) : ui.sel.add(t.id); return drawTx(); }
    if (k === 'c') { e.preventDefault(); const c = $('.tx.cur .chip'); if (c) A.pick(c); return; }
    if (k === 'Enter') { ui.drawer = t.id; return drawDrawer(); }
    if (k === 'e') { e.preventDefault(); ui.drawer = t.id; drawDrawer(); const n = $('#dNote'); n.focus(); n.select(); return; }
    if (k === 's') { e.preventDefault(); sp = null; return A.split($('.tx.cur')); }
  });
  window.addEventListener('beforeunload', () => saveNow());
  window.addEventListener('focus', SG.check);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') SG.check(); else if (SG.on() && SG.dirty() && SG.state === 'pending') SG.push(); });
}
function boot() { load(); shell(); wire(); render(); SG.init(); }
window.Ledger = { get state() { return S; }, get index() { return IX; }, ui, go, importFiles, act, render, Core, sg: SG };
boot();

})();
</script>
